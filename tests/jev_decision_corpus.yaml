# Jev decision-model benchmark corpus (v1).
#
# Offline bench for the local System One candidates (Von, Laya, Kev-0.8B,
# Simple-Jev) against the hosted Jev reference. Each entry labels the exact
# `router.build_request` questions for one utterance, plus the route that
# `router.decide` must produce for it.
#
# Schema per entry:
#   id: unique stable slug
#   say: exact utterance, as transcribed (may carry a `speaker <Name>` prefix)
#   expected_route: execute | clarify | fallback
#   expected: question labels. request_kind is always required. target,
#     action, color, reference are required bindings only when
#     expected_route is execute; elsewhere they are optional hints and the
#     scorer checks the route alone (plus that no action executes).
#   value: exact number, required when action is set_brightness/set_temperature
#   targets: HA entity IDs acted on, required when expected_route is execute
#   service: domain.service invoked, required when expected_route is execute
#   notes: free-form expectation or layering note
#
# Layering notes: the corpus scores the Jev decision layer in isolation.
# Music play/stop, shopping, and state queries are caught earlier by
# automations or local intents live; here they are labeled by what the
# schema alone permits (usually unsupported -> clarify).
#
# Growth: append new cases with fresh ids; never renumber. Recorded model
# outputs live in tests/fixtures/jev_decisions/<model>.json, produced by
# scripts/record_jev_decisions.py. Scored by tests/test_jev_decision_bench.py.
# Schema validated by tests/test_jev_decision_corpus.py against the live
# router allowlists.

# Paraphrase misses: deterministic intents fail these, the decision model
