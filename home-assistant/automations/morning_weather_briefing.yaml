id: morning_weather_briefing
alias: "Morning: Weather & Rain Briefing"
description: >-
  Send a weather briefing to phone 5 minutes after the Bedroom Wake Time
  helper, with rain alerts, home or away. Fires once inside the minute after
  wake plus 5, so a restart during the window still delivers it.
triggers:
  - trigger: time_pattern
    minutes: "/1"
conditions:
  - condition: template
    value_template: >-
      {% set wake_ts = as_timestamp(today_at(states('input_datetime.bedroom_wake_time')), none) %}
      {{ wake_ts is not none and wake_ts + 300 <= as_timestamp(now()) < wake_ts + 360 }}
actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: daily_forecast
  - action: notify.send_message
    target:
      entity_id: notify.rupan_phone
    data:
      title: Morning Weather Briefing
      message: >-
        {% set today = daily_forecast['weather.forecast_home'].forecast[0] %}
        Good morning! Today will be {{ today.condition }} with a high of
        {{ today.temperature }}° and a low of {{ today.templow }}°.
        {%- if 'rain' in (today.condition | lower) or (today.precipitation | default(0)) > 0 %}
        Don't forget an umbrella today! {%- endif %}
mode: single
