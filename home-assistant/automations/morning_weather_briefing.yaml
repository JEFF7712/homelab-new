id: morning_weather_briefing
alias: "Morning: Weather & Rain Briefing"
description: >-
  Send a weather briefing to phone 5 minutes after the Bedroom Wake Time
  helper, with rain alerts, home or away. A restart catch-up trigger covers
  a HA restart during the window. Falls back to a short message when the
  forecast call fails or returns empty.
triggers:
  - trigger: time
    at: input_datetime.bedroom_wake_time
    offset: "00:05:00"
    id: "wake_plus_five"
  - trigger: homeassistant
    event: start
    id: "restart_catchup"
conditions:
  - condition: template
    value_template: >-
      {% set wake = states('input_datetime.bedroom_wake_time') %}
      {% set wake_ts = as_timestamp(today_at(wake), none)
      if wake not in ('unknown', 'unavailable', '') else none %}
      {{ wake_ts is not none and wake_ts + 300 <= as_timestamp(now()) < wake_ts + 360 }}
actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: daily_forecast
    continue_on_error: true
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ daily_forecast is defined and
                 daily_forecast.get('weather.forecast_home', {}).get('forecast', []) | length > 0 }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "Morning Weather Briefing"
              message: >-
                {% set today = daily_forecast['weather.forecast_home'].forecast[0] %}
                Good morning! Today will be {{ today.condition }} with a high of {{ today.temperature }}°
                and a low of {{ today.templow }}°.
                {%- if 'rain' in (today.condition | lower) or (today.precipitation | default(0)) > 0 %}
                Don't forget an umbrella today!
                {%- endif %}
      - conditions: []
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.rupan_phone
            data:
              title: "Morning Weather Briefing"
              message: "Good morning! Forecast is unavailable right now, check the weather app before heading out."
mode: single
