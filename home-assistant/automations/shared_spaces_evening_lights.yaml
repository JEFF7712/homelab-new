id: shared_spaces_evening_lights
alias: "Shared Spaces: Kitchen and Living Room Evening Lights"
description: >-
  Turn on kitchen and living room lights at sunset when anyone is home, or
  when someone arrives home after dark. Turn off at sunrise. Leaving and
  empty-house handling stays with Shared Spaces: Lights Off When Empty.
triggers:
  - trigger: sun
    event: sunset
    id: "sunset"
  - trigger: state
    entity_id:
      - person.rupan_sunderapandyan
      - person.sam
    to: "home"
    id: "arrive_home"
  - trigger: sun
    event: sunrise
    id: "sunrise"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "sunset"
          - condition: template
            value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count > 0 }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id:
                - light.kitchen_lights
                - light.living_room_lights
      - conditions:
          - condition: trigger
            id: "arrive_home"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
        sequence:
          - action: light.turn_on
            target:
              entity_id:
                - light.kitchen_lights
                - light.living_room_lights
      - conditions:
          - condition: trigger
            id: "sunrise"
        sequence:
          - action: light.turn_off
            target:
              entity_id:
                - light.kitchen_lights
                - light.living_room_lights
mode: single
