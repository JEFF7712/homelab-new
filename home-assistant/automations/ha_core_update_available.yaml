id: ha_core_update_available
alias: "System: HA Core Update Available"
description: "Notify phone when a new Home Assistant stable release is published."
triggers:
  - trigger: state
    entity_id: sensor.ha_latest_version
    for: "00:10:00"
conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ('unknown', 'unavailable', 'none') }}"
  - condition: template
    value_template: "{{ trigger.to_state.state is match('^\\\\d+\\\\.\\\\d+\\\\.\\\\d+$') }}"
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.from_state.state
      not in ('unknown', 'unavailable', 'none', '') }}
actions:
  - action: notify.send_message
    target:
      entity_id: notify.rupan_phone
    data:
      title: "Home Assistant Update"
      message: >-
        Home Assistant {{ states('sensor.ha_latest_version') }} is available. Time to update when convenient.
mode: single
