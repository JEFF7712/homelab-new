id: device_low_battery_alert
alias: "Devices: Low Battery Alert"
description: >-
  Notify phone when any battery device class sensor stays below the Device
  Low Battery Threshold helper for an hour.
triggers:
  - trigger: template
    value_template: >-
      {{ states.sensor | selectattr('attributes.device_class', 'defined') |
      selectattr('attributes.device_class', 'eq', 'battery') |
      selectattr('state', 'is_number') | map(attribute='state') |
      map('int', 100) | select('lt', states('input_number.device_low_battery_threshold')
      | int(20)) | list | count > 0 }}
    for: "01:00:00"
conditions: []
actions:
  - action: notify.send_message
    target:
      entity_id: notify.rupan_phone
    data:
      title: "Low Battery"
      message: >-
        {% set ns = namespace(devs=[]) %}
        {% set limit = states('input_number.device_low_battery_threshold') | int(20) %}
        {% for s in states.sensor | selectattr('attributes.device_class', 'defined') |
        selectattr('attributes.device_class', 'eq', 'battery') |
        selectattr('state', 'is_number') %}
        {% if s.state | int(100) < limit %}{% set ns.devs = ns.devs + [s.name ~ ' (' ~ s.state ~ '%)'] %}{% endif %}
        {% endfor %}
        These batteries are low: {{ ns.devs | join(', ') }}.
mode: single
