id: device_low_battery_alert
alias: "Devices: Low Battery Alert"
description: >-
  Notify phone when any non-phone battery device class sensor stays below the
  Device Low Battery Threshold helper for an hour. The template trigger is a
  one-shot digest: while it stays true no re-fire happens, so a daily noon
  reminder re-notifies while low batteries remain.
triggers:
  - trigger: template
    value_template: >-
      {% set ignored = ['sensor.rupan_phone_battery_level', 'sensor.sm_s948u1_battery_level', 'sensor.jayanth_phone_battery_level'] %}
      {{ states.sensor | selectattr('attributes.device_class', 'defined') |
      selectattr('attributes.device_class', 'eq', 'battery') |
      rejectattr('entity_id', 'in', ignored) |
      selectattr('state', 'is_number') | map(attribute='state') |
      map('int', 100) | select('lt', states('input_number.device_low_battery_threshold')
      | int(20)) | list | count > 0 }}
    for: "01:00:00"
    id: "new_low"
  - trigger: time
    at: "12:00:00"
    id: "daily_reminder"
conditions:
  - condition: template
    value_template: >-
      {% set ignored = ['sensor.rupan_phone_battery_level', 'sensor.sm_s948u1_battery_level', 'sensor.jayanth_phone_battery_level'] %}
      {{ states.sensor | selectattr('attributes.device_class', 'defined') |
      selectattr('attributes.device_class', 'eq', 'battery') |
      rejectattr('entity_id', 'in', ignored) |
      selectattr('state', 'is_number') | map(attribute='state') |
      map('int', 100) | select('lt', states('input_number.device_low_battery_threshold')
      | int(20)) | list | count > 0 }}
actions:
  - action: notify.send_message
    target:
      entity_id: notify.rupan_phone
    data:
      title: "Low Battery"
      message: >-
        {% set ignored = ['sensor.rupan_phone_battery_level', 'sensor.sm_s948u1_battery_level', 'sensor.jayanth_phone_battery_level'] %}
        {% set ns = namespace(devs=[]) %}
        {% set limit = states('input_number.device_low_battery_threshold') | int(20) %}
        {% for s in states.sensor | selectattr('attributes.device_class', 'defined') |
        selectattr('attributes.device_class', 'eq', 'battery') |
        rejectattr('entity_id', 'in', ignored) |
        selectattr('state', 'is_number') %}
        {% if s.state | int(100) < limit %}{% set ns.devs = ns.devs + [s.name ~ ' (' ~ s.state ~ '%)'] %}{% endif %}
        {% endfor %}
        These batteries are low: {{ ns.devs | join(', ') }}.
mode: single
