id: jarvis_satellite_tts_mic_mute
alias: "Jarvis: Mute Mic During TTS"
description: >-
  Mute the satellite microphone while Jarvis is responding and unmute 300 ms
  after it goes idle. Breaks the acoustic TTS-echo loop (speaker audio
  re-entering the mic and triggering new turns). Barge-in during TTS does
  not work while this is active; speak after Jarvis finishes. Tune the tail
  with the delay below (150-500 ms range).
mode: restart
initial_state: false
triggers:
  - trigger: state
    entity_id: assist_satellite.homelab_05_satellite_assist_satellite
    to: "responding"
    id: "responding"
  - trigger: state
    entity_id: assist_satellite.homelab_05_satellite_assist_satellite
    to: "idle"
    id: "idle"
  - trigger: homeassistant
    event: start
    id: "ha_start"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "responding"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.homelab_05_satellite_mute
      - conditions:
          - condition: trigger
            id:
              - "idle"
              - "ha_start"
        sequence:
          - delay:
              milliseconds: 300
          - action: switch.turn_off
            target:
              entity_id: switch.homelab_05_satellite_mute
