id: watchman_missing_report
alias: "Maintenance: Watchman Missing Entities Report"
description: >-
  Notify each morning when Watchman finds configuration references to
  missing entities or actions, so drift gets fixed instead of rotting.
  Press button.watchman_create_report_file in the UI for the full detail file.
triggers:
  - trigger: time
    at: "09:00:00"
    id: "daily"
conditions:
  - condition: or
    conditions:
      - condition: numeric_state
        entity_id: sensor.watchman_missing_entities
        above: 0
      - condition: numeric_state
        entity_id: sensor.watchman_missing_actions
        above: 0
actions:
  - action: notify.send_message
    target:
      entity_id: notify.rupan_phone
    data:
      title: "Watchman: Configuration Drift"
      message: >-
        Watchman found {{ states('sensor.watchman_missing_entities') }}
        missing entities and {{ states('sensor.watchman_missing_actions') }}
        missing actions in configuration. Check the Watchman report for details.
mode: single
