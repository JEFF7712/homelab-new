id: living_room_sign_by_presence
alias: "Living Room: Good Vibes Sign by Presence"
description: "Turn on the Good Vibes sign when anyone arrives home during evening hours; off when empty or at sunrise."
triggers:
  - trigger: state
    entity_id:
      - person.rupan_sunderapandyan
      - person.sam
    to: "home"
    id: "arrive"
  - trigger: state
    entity_id:
      - person.rupan_sunderapandyan
      - person.sam
    to: "not_home"
    id: "leave"
  - trigger: sun
    event: sunset
    id: "sunset"
  - trigger: sun
    event: sunrise
    id: "sunrise"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "leave"
          - condition: template
            value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count == 0 }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.living_room_good_vibes_sign
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "arrive"
              - condition: trigger
                id: "sunset"
          - condition: template
            value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count > 0 }}"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.living_room_good_vibes_sign
      - conditions:
          - condition: trigger
            id: "sunrise"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.living_room_good_vibes_sign
mode: single
