id: bedroom_lights_evening_presence
alias: "Bedroom Lights: Evening Presence"
description: "Turn on bedroom lights when home after sunset; full brightness before 10 PM, dim and warm late at night. Turn off when leaving or at sunrise."
triggers:
  - trigger: sun
    event: sunset
    id: "sunset"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    to: "home"
    id: "arrive_home"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    from: "home"
    id: "leave_home"
  - trigger: sun
    event: sunrise
    id: "sunrise"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "sunset"
          - condition: state
            entity_id: person.rupan_sunderapandyan
            state: "home"
          - condition: not
            conditions:
              - condition: time
                after: "22:00:00"
                before: "08:00:00"
        sequence:
          - action: switch.turn_on
            target:
              entity_id:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
          - action: light.turn_on
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
      - conditions:
          - condition: trigger
            id: "sunset"
          - condition: state
            entity_id: person.rupan_sunderapandyan
            state: "home"
          - condition: time
            after: "22:00:00"
            before: "08:00:00"
        sequence:
          - action: switch.turn_on
            target:
              entity_id:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
          - action: light.turn_on
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
            data:
              brightness_pct: 20
              color_temp_kelvin: 2700
      - conditions:
          - condition: trigger
            id: "arrive_home"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
          - condition: not
            conditions:
              - condition: time
                after: "22:00:00"
                before: "08:00:00"
        sequence:
          - action: switch.turn_on
            target:
              entity_id:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
          - action: light.turn_on
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
      - conditions:
          - condition: trigger
            id: "arrive_home"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
          - condition: time
            after: "22:00:00"
            before: "08:00:00"
        sequence:
          - action: switch.turn_on
            target:
              entity_id:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
          - action: light.turn_on
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
            data:
              brightness_pct: 20
              color_temp_kelvin: 2700
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "leave_home"
              - condition: trigger
                id: "sunrise"
        sequence:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
          - action: light.turn_off
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
mode: single
