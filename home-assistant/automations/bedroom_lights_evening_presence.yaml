id: bedroom_lights_evening_presence
alias: "Bedroom Lights: Evening Presence"
description: "Turn on bedroom lights when home after sunset; turn off when leaving or at sunrise."
triggers:
  - trigger: sun
    event: sunset
    id: "sunset"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    to: "home"
    id: "arrive_home"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    from: "home"
    id: "leave_home"
  - trigger: sun
    event: sunrise
    id: "sunrise"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "sunset"
          - condition: state
            entity_id: person.rupan_sunderapandyan
            state: "home"
        sequence:
          - action: switch.turn_on
            target:
              entity_id:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
          - action: light.turn_on
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
      - conditions:
          - condition: trigger
            id: "arrive_home"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
        sequence:
          - action: switch.turn_on
            target:
              entity_id:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
          - action: light.turn_on
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "leave_home"
              - condition: trigger
                id: "sunrise"
        sequence:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
          - action: light.turn_off
            target:
              entity_id:
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
mode: single
# CI trigger touch: no-op comment so changes: includes HA jobs post-merge
