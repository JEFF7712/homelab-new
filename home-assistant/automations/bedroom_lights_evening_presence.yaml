id: bedroom_lights_evening_presence
alias: "Bedroom Lights: Evening Presence"
description: >-
  Turn on bedroom lights when home after sunset via the shared bedroom
  scripts. Brightness and color temperature are owned by Adaptive Lighting.
  Turn off when leaving or at sunrise. Skipped while Vacation Mode is on.
triggers:
  - trigger: sun
    event: sunset
    id: "sunset"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    to: "home"
    id: "arrive_home"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    from: "home"
    id: "leave_home"
  - trigger: sun
    event: sunrise
    id: "sunrise"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "sunset"
          - condition: state
            entity_id: person.rupan_sunderapandyan
            state: "home"
          - condition: state
            entity_id: input_boolean.vacation_mode
            state: "off"
        sequence:
          - action: script.bedroom_lights_on
      - conditions:
          - condition: trigger
            id: "arrive_home"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
          - condition: state
            entity_id: input_boolean.vacation_mode
            state: "off"
        sequence:
          - action: script.bedroom_lights_on
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "leave_home"
              - condition: trigger
                id: "sunrise"
        sequence:
          - action: script.bedroom_lights_off
mode: single
