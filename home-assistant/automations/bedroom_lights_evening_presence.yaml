id: bedroom_lights_evening_presence
alias: "Bedroom Lights: Evening Presence"
description: >-
  Turn on bedroom lights when home after sunset via the shared bedroom
  scripts; full brightness before 10 PM, dim and warm late at night.
  Turn off when leaving or at sunrise.
triggers:
  - trigger: sun
    event: sunset
    id: "sunset"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    to: "home"
    id: "arrive_home"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    from: "home"
    id: "leave_home"
  - trigger: sun
    event: sunrise
    id: "sunrise"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "sunset"
          - condition: state
            entity_id: person.rupan_sunderapandyan
            state: "home"
          - condition: not
            conditions:
              - condition: time
                after: "22:00:00"
                before: "08:00:00"
        sequence:
          - action: script.bedroom_lights_on
            data:
              dim: false
      - conditions:
          - condition: trigger
            id: "sunset"
          - condition: state
            entity_id: person.rupan_sunderapandyan
            state: "home"
          - condition: time
            after: "22:00:00"
            before: "08:00:00"
        sequence:
          - action: script.bedroom_lights_on
            data:
              dim: true
      - conditions:
          - condition: trigger
            id: "arrive_home"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
          - condition: not
            conditions:
              - condition: time
                after: "22:00:00"
                before: "08:00:00"
        sequence:
          - action: script.bedroom_lights_on
            data:
              dim: false
      - conditions:
          - condition: trigger
            id: "arrive_home"
          - condition: state
            entity_id: sun.sun
            state: "below_horizon"
          - condition: time
            after: "22:00:00"
            before: "08:00:00"
        sequence:
          - action: script.bedroom_lights_on
            data:
              dim: true
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "leave_home"
              - condition: trigger
                id: "sunrise"
        sequence:
          - action: script.bedroom_lights_off
mode: single
