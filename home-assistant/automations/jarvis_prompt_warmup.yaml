id: jarvis_prompt_warmup
alias: "Jarvis: Warm Prompt KV Cache"
description: >-
  Warms the Jarvis conversation LLM KV cache on Home Assistant startup
  or satellite reconnect so the first user voice turn does not suffer cold-start
  prompt evaluation latency.
triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: assist_satellite.homelab_05_satellite_assist_satellite
    from:
      - unavailable
      - unknown
    to: idle
conditions: []
actions:
  - delay: "00:00:10"
  - action: conversation.process
    data:
      agent_id: conversation.jarvis
      text: ping
    continue_on_error: true
mode: single
