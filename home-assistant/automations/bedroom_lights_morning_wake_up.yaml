id: bedroom_lights_morning_wake_up
alias: "Bedroom Lights: Morning Wake-Up"
description: "Turn on bedroom lights at 8:00 AM if home. Roku lights come on warm and gentle."
triggers:
  - trigger: time
    at: "08:00:00"
conditions:
  - condition: state
    entity_id: person.rupan_sunderapandyan
    state: "home"
actions:
  - action: switch.turn_on
    target:
      entity_id:
        - switch.0xffffb40e0608c96f
        - switch.0xffffb40e0608d02e
  - action: light.turn_on
    target:
      entity_id:
        - light.desk_lamp_desk_lamp
        - light.floor_lamp_floor_lamp
        - light.light_strip_light_strip
    data:
      brightness_pct: 30
      color_temp_kelvin: 2700
mode: single
