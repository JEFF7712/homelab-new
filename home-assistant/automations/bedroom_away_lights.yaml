id: bedroom_away_lights
alias: "Bedroom: Lights Off While Away"
description: >-
  Rupan bedroom only. Snapshot and switch bedroom lights off when Rupan
  leaves, keep them off while Rupan is away, restore the snapshot on return.
triggers:
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    from: "home"
    id: "away"
  - trigger: state
    entity_id: person.rupan_sunderapandyan
    to: "home"
    id: "return"
  - trigger: state
    entity_id:
      - switch.0xffffb40e0608c96f
      - switch.0xffffb40e0608d02e
      - light.desk_lamp_desk_lamp
      - light.floor_lamp_floor_lamp
      - light.light_strip_light_strip
    to: "on"
    id: "enforced"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "away"
        sequence:
          - action: scene.create
            data:
              scene_id: pre_away_bedroom
              snapshot_entities:
                - switch.0xffffb40e0608c96f
                - switch.0xffffb40e0608d02e
                - light.desk_lamp_desk_lamp
                - light.floor_lamp_floor_lamp
                - light.light_strip_light_strip
          - action: script.bedroom_lights_off
      - conditions:
          - condition: trigger
            id: "enforced"
          - condition: state
            entity_id: person.rupan_sunderapandyan
            state: "not_home"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ trigger.entity_id }}"
      - conditions:
          - condition: trigger
            id: "return"
          - condition: template
            value_template: "{{ states('scene.pre_away_bedroom') not in ('unknown', 'unavailable') }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.pre_away_bedroom
mode: queued
