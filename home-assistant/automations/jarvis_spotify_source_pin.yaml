id: jarvis_spotify_source_pin
alias: Pin Spotify output to Jarvis satellite
description: >-
  Whenever the Spotify integration becomes active or returns to idle, force-select
  the Music Assistant speaker group as the playback target so audio routes to
  the Jarvis satellite and the soundbar. Catches the cold-start case where
  Spotify boots with no source and silently drops HA-initiated playback.
mode: single
trigger:
  - platform: state
    entity_id: media_player.spotify_rupan
    to: "idle"
    for: "00:00:05"
  - platform: state
    entity_id: media_player.spotify_rupan
    to: "playing"
action:
  - action: media_player.select_source
    target:
      entity_id: media_player.spotify_rupan
    data:
      source: Homelab 05 Satellite Media Player | Music Assistant
    continue_on_error: true
