title: Home
icon: mdi:home
require_admin: true
show_in_sidebar: true
button_card_templates:
  mobile_nav_button:
    show_name: false
    size: 22px
    aspect_ratio: 1/1
    styles:
      card:
        - background: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(255, 183, 77, 0.95)'
                : 'transparent';
            ]]]
        - border-radius: 50%
        - width: 46px
        - height: 46px
        - box-shadow: none
        - border: none
        - margin: 0 auto
      icon:
        - color: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(20, 20, 20, 0.95)'
                : 'rgba(255, 255, 255, 0.7)';
            ]]]
views:
  - title: Home
    type: sections
    footer:
      max_width: 400
      card:
        type: custom:button-card
        show_name: false
        show_icon: false
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - background: rgba(22, 22, 26, 0.88)
            - backdrop-filter: blur(16px) saturate(1.3)
            - border-radius: 999px
            - border: 1px solid rgba(255, 255, 255, 0.09)
            - box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5)
            - padding: 6px 8px
            - margin-bottom: 8px
          grid:
            - grid-template-areas: '"b1 b2 b3 b4 b5"'
            - grid-template-columns: 1fr 1fr 1fr 1fr 1fr
          custom_fields:
            b1:
              - justify-self: center
            b2:
              - justify-self: center
            b3:
              - justify-self: center
            b4:
              - justify-self: center
            b5:
              - justify-self: center
        custom_fields:
          b1:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: home-overview
              icon: mdi:home
              tap_action:
                action: navigate
                navigation_path: /home-overview
          b2:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: bedroom-lights
              icon: mdi:bed
              tap_action:
                action: navigate
                navigation_path: /bedroom-lights
          b3:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: shared-spaces
              icon: mdi:sofa
              tap_action:
                action: navigate
                navigation_path: /shared-spaces
          b4:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: 3d-printing
              icon: mdi:printer-3d
              tap_action:
                action: navigate
                navigation_path: /3d-printing
          b5:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: map
              icon: mdi:map
              tap_action:
                action: navigate
                navigation_path: /map
    sections:
      - cards:
          - type: heading
            heading: Boards
          - type: button
            name: Rupan Bedroom
            icon: mdi:bed
            tap_action:
              action: navigate
              navigation_path: /bedroom-lights
          - type: button
            name: 3D Printing
            icon: mdi:printer-3d
            tap_action:
              action: navigate
              navigation_path: /3d-printing
          - type: button
            name: Shared Spaces
            icon: mdi:sofa
            tap_action:
              action: navigate
              navigation_path: /shared-spaces
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
      - cards:
          - type: heading
            heading: Status
          - type: glance
            entities:
              - entity: sensor.a1_03900d642327265_print_status
                name: Printer
              - entity: sensor.a1_03900d642327265_print_progress
                name: Progress
              - entity: sensor.a1_03900d642327265_remaining_time
                name: Remaining
              - entity: switch.stairs_light
                name: Stairs
              - entity: switch.kitchen_mushroom_lamp
                name: Mushroom Lamp
          - type: entities
            title: System
            entities:
              - entity: sensor.backup_last_successful_automatic_backup
                name: Last backup
              - entity: sensor.backup_next_scheduled_automatic_backup
                name: Next backup
              - entity: sensor.ha_latest_version
                name: Latest HA version
