title: Rupan Bedroom
icon: mdi:bed
require_admin: true
show_in_sidebar: true
views:
  - title: Bedroom
    type: sections
    sections:
      - cards:
          - type: heading
            heading: Lights
          - type: custom:mushroom-light-card
            entity: light.desk_lamp_desk_lamp
            name: Desk Lamp
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.floor_lamp_floor_lamp
            name: Floor Lamp
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.light_strip_light_strip
            name: Light Strip
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
      - cards:
          - type: heading
            heading: Plugs
          - type: horizontal-stack
            cards:
              - type: button
                entity: switch.bedroom_window_plug
                name: Window Plug
                icon: mdi:power-plug
                show_state: true
                tap_action:
                  action: toggle
              - type: button
                entity: switch.bedroom_mushroom_plug
                name: Mushroom Plug
                icon: mdi:power-plug
                show_state: true
                tap_action:
                  action: toggle
