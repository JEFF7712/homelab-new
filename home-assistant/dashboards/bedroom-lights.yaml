title: Rupan Bedroom
icon: mdi:bed
require_admin: true
show_in_sidebar: true
button_card_templates:
  mobile_nav_button:
    show_name: false
    size: 22px
    aspect_ratio: 1/1
    styles:
      card:
        - background: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(255, 183, 77, 0.95)'
                : 'transparent';
            ]]]
        - border-radius: 50%
        - width: 46px
        - height: 46px
        - box-shadow: none
        - border: none
        - margin: 0 auto
      icon:
        - color: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(20, 20, 20, 0.95)'
                : 'var(--secondary-text-color)';
            ]]]
views:
  - title: Bedroom
    type: sections
    footer:
      max_width: 400
      card:
        type: custom:button-card
        show_name: false
        show_icon: false
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - background: color-mix(in srgb, var(--card-background-color) 82%, transparent)
            - backdrop-filter: blur(16px) saturate(1.3)
            - border-radius: 40px
            - border: 1px solid var(--divider-color)
            - box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5)
            - padding: 10px
            - margin: 0 auto 4px auto
            - height: 60px
            - width: 310px
            - overflow: visible
            - --mdc-ripple-color: transparent
            - position: fixed
            - bottom: max(12px, env(safe-area-inset-bottom))
            - left: 50%
            - transform: translateX(-50%)
            - z-index: 20
          grid:
            - display: grid
            - grid-template-areas: '"b1 b2 b3 b4 b5"'
            - grid-template-columns: 1fr 1fr 1fr 1fr 1fr
            - column-gap: 14px
            - justify-content: center
          custom_fields:
            b1:
              - justify-self: center
            b2:
              - justify-self: center
            b3:
              - justify-self: center
            b4:
              - justify-self: center
            b5:
              - justify-self: center
        custom_fields:
          b1:
            card:
              type: custom:button-card
              icon: mdi:home
              show_name: false
              show_state: false
              tap_action:
                action: navigate
                navigation_path: /home-overview
              styles:
                card:
                  - height: 40px
                  - width: 40px
                  - margin: 0
                  - padding: 10px
                  - overflow: visible
                  - border-radius: 500px
                  - background: |
                      [[[
                        return window.location.pathname.includes('home-overview')
                          ? 'rgba(255, 183, 77, 0.95)'
                          : 'transparent';
                      ]]]
                icon:
                  - height: 100%
                  - width: 100%
                  - color: |
                      [[[
                        return window.location.pathname.includes('home-overview')
                          ? 'rgba(20, 20, 20, 0.95)'
                          : 'var(--secondary-text-color)';
                      ]]]
          b2:
            card:
              type: custom:button-card
              icon: mdi:bed
              show_name: false
              show_state: false
              tap_action:
                action: navigate
                navigation_path: /bedroom-lights
              styles:
                card:
                  - height: 40px
                  - width: 40px
                  - margin: 0
                  - padding: 10px
                  - overflow: visible
                  - border-radius: 500px
                  - background: |
                      [[[
                        return window.location.pathname.includes('bedroom-lights')
                          ? 'rgba(255, 183, 77, 0.95)'
                          : 'transparent';
                      ]]]
                icon:
                  - height: 100%
                  - width: 100%
                  - color: |
                      [[[
                        return window.location.pathname.includes('bedroom-lights')
                          ? 'rgba(20, 20, 20, 0.95)'
                          : 'var(--secondary-text-color)';
                      ]]]
          b3:
            card:
              type: custom:button-card
              icon: mdi:sofa
              show_name: false
              show_state: false
              tap_action:
                action: navigate
                navigation_path: /shared-spaces
              styles:
                card:
                  - height: 40px
                  - width: 40px
                  - margin: 0
                  - padding: 10px
                  - overflow: visible
                  - border-radius: 500px
                  - background: |
                      [[[
                        return window.location.pathname.includes('shared-spaces')
                          ? 'rgba(255, 183, 77, 0.95)'
                          : 'transparent';
                      ]]]
                icon:
                  - height: 100%
                  - width: 100%
                  - color: |
                      [[[
                        return window.location.pathname.includes('shared-spaces')
                          ? 'rgba(20, 20, 20, 0.95)'
                          : 'var(--secondary-text-color)';
                      ]]]
          b4:
            card:
              type: custom:button-card
              icon: mdi:printer-3d
              show_name: false
              show_state: false
              tap_action:
                action: navigate
                navigation_path: /3d-printing
              styles:
                card:
                  - height: 40px
                  - width: 40px
                  - margin: 0
                  - padding: 10px
                  - overflow: visible
                  - border-radius: 500px
                  - background: |
                      [[[
                        return window.location.pathname.includes('3d-printing')
                          ? 'rgba(255, 183, 77, 0.95)'
                          : 'transparent';
                      ]]]
                icon:
                  - height: 100%
                  - width: 100%
                  - color: |
                      [[[
                        return window.location.pathname.includes('3d-printing')
                          ? 'rgba(20, 20, 20, 0.95)'
                          : 'var(--secondary-text-color)';
                      ]]]
          b5:
            card:
              type: custom:button-card
              icon: mdi:map
              show_name: false
              show_state: false
              tap_action:
                action: navigate
                navigation_path: /map
              styles:
                card:
                  - height: 40px
                  - width: 40px
                  - margin: 0
                  - padding: 10px
                  - overflow: visible
                  - border-radius: 500px
                  - background: |
                      [[[
                        return window.location.pathname.includes('map')
                          ? 'rgba(255, 183, 77, 0.95)'
                          : 'transparent';
                      ]]]
                icon:
                  - height: 100%
                  - width: 100%
                  - color: |
                      [[[
                        return window.location.pathname.includes('map')
                          ? 'rgba(20, 20, 20, 0.95)'
                          : 'var(--secondary-text-color)';
                      ]]]
    sections:
      - cards:
          - type: heading
            heading: Lights
          - type: custom:mushroom-light-card
            entity: light.desk_lamp_desk_lamp
            name: Desk Lamp
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.floor_lamp_floor_lamp
            name: Floor Lamp
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.light_strip_light_strip
            name: Light Strip
            fill_container: true
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
      - cards:
          - type: heading
            heading: Plugs
          - type: horizontal-stack
            cards:
              - type: button
                entity: switch.bedroom_window_plug
                name: Window Plug
                icon: mdi:power-plug
                show_state: true
                tap_action:
                  action: toggle
              - type: button
                entity: switch.bedroom_mushroom_plug
                name: Mushroom Plug
                icon: mdi:power-plug
                show_state: true
                tap_action:
                  action: toggle
