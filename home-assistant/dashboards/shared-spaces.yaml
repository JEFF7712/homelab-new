title: Shared Spaces
icon: mdi:sofa
require_admin: false
show_in_sidebar: true
views:
  - title: Shared Spaces
    sections:
      - cards:
          - heading: All Lights
            type: heading
          - entity: light.all_govee_lights
            name: All Govee Lights
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
      - cards:
          - heading: All Devices
            type: heading
          - type: horizontal-stack
            cards:
              - type: button
                name: All On
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_on
                  target:
                    label_id: shared_space
              - type: button
                name: All Off
                icon: mdi:power-off
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_off
                  target:
                    label_id: shared_space
      - cards:
          - heading: Rooms
            type: heading
          - name: Stairs
            icon: mdi:stairs
            entity: switch.stairs_light
            hold_action:
              action: toggle
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /shared-spaces/stairs
            type: button
          - name: Kitchen
            icon: mdi:stove
            tap_action:
              action: navigate
              navigation_path: /shared-spaces/kitchen
            type: button
          - name: Living Room
            icon: mdi:sofa
            tap_action:
              action: navigate
              navigation_path: /shared-spaces/living-room
            type: button
    type: sections
  - title: Stairs
    path: stairs
    sections:
      - cards:
          - heading: Stairs
            type: heading
          - name: Stairs Light
            entity: switch.stairs_light
            features:
              - type: toggle
            type: tile
    subview: true
    type: sections
  - title: Kitchen
    path: kitchen
    sections:
      - cards:
          - heading: Kitchen
            type: heading
          - entity: light.kitchen_lights
            name: All Kitchen Lights
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: light.kitchen_light
            name: Kitchen Light
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: light.kitchen_light_2
            name: Kitchen Light 2
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: switch.kitchen_mushroom_lamp
            name: Mushroom Lamp
            features:
              - type: toggle
            type: tile
    subview: true
    type: sections
  - title: Living Room
    path: living-room
    sections:
      - cards:
          - heading: Living Room
            type: heading
          - entity: switch.living_room_good_vibes_sign
            features:
              - type: toggle
            type: tile
          - entity: light.living_room_lights
            name: All Living Room Lights
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: light.living_room_mushroom_lamp
            name: Floor Lamp
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: light.living_room_tulip_lamp
            name: Tulip Lamp
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: climate.living_room_ac_living_room_ac_thermostat
            type: thermostat
    subview: true
    type: sections
