title: Shared Spaces
icon: mdi:sofa
require_admin: false
show_in_sidebar: true
button_card_templates:
  mobile_nav_button:
    show_name: false
    size: 22px
    aspect_ratio: 1/1
    styles:
      card:
        - background: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(255, 183, 77, 0.95)'
                : 'transparent';
            ]]]
        - border-radius: 50%
        - width: 46px
        - height: 46px
        - box-shadow: none
        - border: none
        - margin: 0 auto
      icon:
        - color: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(20, 20, 20, 0.95)'
                : 'rgba(255, 255, 255, 0.7)';
            ]]]
views:
  - title: Shared Spaces
    footer:
      max_width: 400
      card:
        type: grid
        columns: 5
        square: false
        card_mod:
          style: |
            :host {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card {
              background: rgba(22, 22, 26, 0.88) !important;
              backdrop-filter: blur(16px) saturate(1.3);
              -webkit-backdrop-filter: blur(16px) saturate(1.3);
              border-radius: 999px !important;
              border: 1px solid rgba(255, 255, 255, 0.09) !important;
              box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5) !important;
              padding: 6px 8px !important;
            }
        cards:
          - type: custom:button-card
            template: mobile_nav_button
            variables:
              path: home-overview
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /home-overview
          - type: custom:button-card
            template: mobile_nav_button
            variables:
              path: bedroom-lights
            icon: mdi:bed
            tap_action:
              action: navigate
              navigation_path: /bedroom-lights
          - type: custom:button-card
            template: mobile_nav_button
            variables:
              path: shared-spaces
            icon: mdi:sofa
            tap_action:
              action: navigate
              navigation_path: /shared-spaces
          - type: custom:button-card
            template: mobile_nav_button
            variables:
              path: 3d-printing
            icon: mdi:printer-3d
            tap_action:
              action: navigate
              navigation_path: /3d-printing
          - type: custom:button-card
            template: mobile_nav_button
            variables:
              path: map
            icon: mdi:map
            tap_action:
              action: navigate
              navigation_path: /map
    sections:
      - cards:
          - type: markdown
            content: |
              ## Shared Spaces
              {{ states.light | selectattr('state', 'eq', 'on') | list | count }} lights are on right now
          - type: custom:mushroom-chips-card
            chips:
              - type: weather
                entity: weather.forecast_home
                show_temperature: true
                show_conditions: true
              - type: entity
                entity: sun.sun
              - type: entity
                entity: sensor.sun_next_rising
                name: Sunrise
                icon: mdi:weather-sunset-up
              - type: entity
                entity: sensor.sun_next_setting
                name: Sunset
                icon: mdi:weather-sunset-down
          - type: weather-forecast
            entity: weather.forecast_home
            show_forecast: true
            forecast_type: daily
      - cards:
          - heading: Family
            type: heading
          - type: custom:mushroom-person-card
            entity: person.rupan_sunderapandyan
            fill_container: true
          - type: custom:mushroom-person-card
            entity: person.sam
            fill_container: true
          - heading: Scenes
            type: heading
          - type: custom:mushroom-chips-card
            chips:
              - type: action
                name: Cooking
                icon: mdi:stove
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.cooking_bright_kitchen
              - type: action
                name: Dinner
                icon: mdi:food-fork-drink
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.dinner_warm_dim
              - type: action
                name: Movie
                icon: mdi:movie
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.movie_low_living_room
              - type: action
                name: Party
                icon: mdi:party-popper
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.effects_party_mode
              - type: action
                name: Candlelight
                icon: mdi:candle
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.effects_candlelight_dinner
              - type: action
                name: Night
                icon: mdi:weather-night
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.effects_night_light
      - cards:
          - heading: Rooms
            type: heading
          - type: horizontal-stack
            cards:
              - name: Stairs
                icon: mdi:stairs
                entity: switch.stairs_light
                hold_action:
                  action: toggle
                show_state: true
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/stairs
                type: button
              - name: Kitchen
                icon: mdi:stove
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/kitchen
                type: button
              - name: Living Room
                icon: mdi:sofa
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/living-room
                type: button
          - heading: All Lights
            type: heading
          - entity: light.all_govee_lights
            name: All Govee Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light
            name: Kitchen
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light_2
            name: Kitchen 2
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.living_room_mushroom_lamp
            name: Floor Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.living_room_tulip_lamp
            name: Tulip Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: horizontal-stack
            cards:
              - type: button
                name: All On
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_on
                  target:
                    label_id: shared_space
              - type: button
                name: All Off
                icon: mdi:power-off
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_off
                  target:
                    label_id: shared_space
      - cards:
          - heading: Adaptive Lighting
            type: heading
          - entity: switch.adaptive_lighting_all_dimmable_lights_sleep_mode
            name: Sleep Mode
            features:
              - type: toggle
            type: tile
          - entity: switch.adaptive_lighting_all_dimmable_lights_adapt_brightness
            name: Adapt Brightness
            features:
              - type: toggle
            type: tile
          - entity: switch.adaptive_lighting_all_dimmable_lights_adapt_color
            name: Adapt Color
            features:
              - type: toggle
            type: tile
    type: sections
  - title: Stairs
    path: stairs
    sections:
      - cards:
          - heading: Stairs
            type: heading
          - name: Stairs Light
            entity: switch.stairs_light
            features:
              - type: toggle
            type: tile
            tap_action:
              action: toggle
            hold_action:
              action: more-info
    subview: true
    type: sections
  - title: Kitchen
    path: kitchen
    sections:
      - cards:
          - heading: Lights
            type: heading
          - entity: light.kitchen_lights
            name: All Kitchen Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light
            name: Kitchen Light
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light_2
            name: Kitchen Light 2
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: switch.kitchen_mushroom_lamp
            name: Mushroom Lamp
            features:
              - type: toggle
            type: tile
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - cards:
          - heading: Scenes
            type: heading
          - type: custom:mushroom-chips-card
            chips:
              - type: action
                name: Cooking
                icon: mdi:stove
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.cooking_bright_kitchen
              - type: action
                name: Dinner
                icon: mdi:food-fork-drink
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.dinner_warm_dim
    subview: true
    type: sections
  - title: Living Room
    path: living-room
    sections:
      - cards:
          - heading: Lights
            type: heading
          - entity: switch.living_room_good_vibes_sign
            features:
              - type: toggle
            type: tile
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style: |
                :host {
                  {% if is_state('switch.living_room_good_vibes_sign', 'on') %}
                  --tile-color: var(--amber-color);
                  box-shadow: 0 0 14px rgba(255, 193, 7, 0.45);
                  {% endif %}
                }
          - entity: light.living_room_lights
            name: All Living Room Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style:
                mushroom-shape-icon$: |
                  .shape {
                    {% if is_state('light.living_room_lights', 'on') %}
                    --shape-color: rgba(255, 193, 7, 0.25) !important;
                    {% endif %}
                  }
          - entity: light.living_room_mushroom_lamp
            name: Floor Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style:
                mushroom-shape-icon$: |
                  .shape {
                    {% if is_state('light.living_room_mushroom_lamp', 'on') %}
                    --shape-color: rgba(255, 193, 7, 0.25) !important;
                    {% endif %}
                  }
          - entity: light.living_room_tulip_lamp
            name: Tulip Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style:
                mushroom-shape-icon$: |
                  .shape {
                    {% if is_state('light.living_room_tulip_lamp', 'on') %}
                    --shape-color: rgba(255, 193, 7, 0.25) !important;
                    {% endif %}
                  }
      - cards:
          - heading: Climate
            type: heading
          - entity: climate.living_room_ac_living_room_ac_thermostat
            fill_container: true
            type: custom:mushroom-climate-card
            hvac_modes:
              - "off"
              - cool
              - auto
              - fan_only
              - dry
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - cards:
          - heading: Scenes
            type: heading
          - type: custom:mushroom-chips-card
            chips:
              - type: action
                name: Movie
                icon: mdi:movie
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.movie_low_living_room
      - cards:
          - heading: History
            type: heading
          - type: custom:apexcharts-card
            header:
              show: true
              title: Living Room Temperature
            graph_span: 24h
            series:
              - entity: climate.living_room_ac_living_room_ac_thermostat
                attribute: current_temperature
                name: Current
              - entity: climate.living_room_ac_living_room_ac_thermostat
                attribute: temperature
                name: Target
    subview: true
    type: sections
