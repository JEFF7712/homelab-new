title: Shared Spaces
icon: mdi:sofa
require_admin: false
show_in_sidebar: true
views:
  - title: Shared Spaces
    sections:
      - cards:
          - heading: Rooms
            type: heading
          - type: horizontal-stack
            cards:
              - name: Stairs
                icon: mdi:stairs
                entity: switch.stairs_light
                hold_action:
                  action: toggle
                show_state: true
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/stairs
                type: button
              - name: Kitchen
                icon: mdi:stove
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/kitchen
                type: button
              - name: Living Room
                icon: mdi:sofa
                tap_action:
                  action: navigate
                  navigation_path: /shared-spaces/living-room
                type: button
      - cards:
          - heading: Scenes
            type: heading
          - type: custom:mushroom-chips-card
            chips:
              - type: action
                name: Cooking
                icon: mdi:stove
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.cooking_bright_kitchen
              - type: action
                name: Dinner
                icon: mdi:food-fork-drink
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.dinner_warm_dim
              - type: action
                name: Movie
                icon: mdi:movie
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.movie_low_living_room
      - cards:
          - heading: Lights
            type: heading
          - entity: light.all_govee_lights
            name: All Govee Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: horizontal-stack
            cards:
              - type: button
                name: All On
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_on
                  target:
                    label_id: shared_space
              - type: button
                name: All Off
                icon: mdi:power-off
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_off
                  target:
                    label_id: shared_space
      - cards:
          - heading: Home
            type: heading
          - type: custom:mushroom-person-card
            entity: person.rupan_sunderapandyan
            fill_container: true
          - type: custom:mushroom-person-card
            entity: person.sam
            fill_container: true
      - cards:
          - heading: Adaptive Lighting
            type: heading
          - entity: switch.adaptive_lighting_all_dimmable_lights_sleep_mode
            name: Sleep Mode
            features:
              - type: toggle
            type: tile
          - entity: switch.adaptive_lighting_all_dimmable_lights_adapt_brightness
            name: Adapt Brightness
            features:
              - type: toggle
            type: tile
          - entity: switch.adaptive_lighting_all_dimmable_lights_adapt_color
            name: Adapt Color
            features:
              - type: toggle
            type: tile
    type: sections
  - title: Stairs
    path: stairs
    sections:
      - cards:
          - heading: Stairs
            type: heading
          - name: Stairs Light
            entity: switch.stairs_light
            features:
              - type: toggle
            type: tile
            tap_action:
              action: toggle
            hold_action:
              action: more-info
    subview: true
    type: sections
  - title: Kitchen
    path: kitchen
    sections:
      - cards:
          - heading: Lights
            type: heading
          - entity: light.kitchen_lights
            name: All Kitchen Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light
            name: Kitchen Light
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: light.kitchen_light_2
            name: Kitchen Light 2
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - entity: switch.kitchen_mushroom_lamp
            name: Mushroom Lamp
            features:
              - type: toggle
            type: tile
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - cards:
          - heading: Scenes
            type: heading
          - type: custom:mushroom-chips-card
            chips:
              - type: action
                name: Cooking
                icon: mdi:stove
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.cooking_bright_kitchen
              - type: action
                name: Dinner
                icon: mdi:food-fork-drink
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.dinner_warm_dim
    subview: true
    type: sections
  - title: Living Room
    path: living-room
    sections:
      - cards:
          - heading: Lights
            type: heading
          - entity: switch.living_room_good_vibes_sign
            features:
              - type: toggle
            type: tile
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style: |
                :host {
                  {% if is_state('switch.living_room_good_vibes_sign', 'on') %}
                  --tile-color: var(--amber-color);
                  box-shadow: 0 0 14px rgba(255, 193, 7, 0.45);
                  {% endif %}
                }
          - entity: light.living_room_lights
            name: All Living Room Lights
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style:
                mushroom-shape-icon$: |
                  .shape {
                    {% if is_state('light.living_room_lights', 'on') %}
                    --shape-color: rgba(255, 193, 7, 0.25) !important;
                    {% endif %}
                  }
          - entity: light.living_room_mushroom_lamp
            name: Floor Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style:
                mushroom-shape-icon$: |
                  .shape {
                    {% if is_state('light.living_room_mushroom_lamp', 'on') %}
                    --shape-color: rgba(255, 193, 7, 0.25) !important;
                    {% endif %}
                  }
          - entity: light.living_room_tulip_lamp
            name: Tulip Lamp
            fill_container: true
            type: custom:mushroom-light-card
            show_brightness_control: true
            show_color_temp_control: true
            show_color_control: true
            collapsible_controls: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style:
                mushroom-shape-icon$: |
                  .shape {
                    {% if is_state('light.living_room_tulip_lamp', 'on') %}
                    --shape-color: rgba(255, 193, 7, 0.25) !important;
                    {% endif %}
                  }
      - cards:
          - heading: Climate
            type: heading
          - entity: climate.living_room_ac_living_room_ac_thermostat
            fill_container: true
            type: custom:mushroom-climate-card
            hvac_modes:
              - "off"
              - cool
              - auto
              - fan_only
              - dry
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - cards:
          - heading: Scenes
            type: heading
          - type: custom:mushroom-chips-card
            chips:
              - type: action
                name: Movie
                icon: mdi:movie
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.movie_low_living_room
      - cards:
          - heading: History
            type: heading
          - type: custom:apexcharts-card
            header:
              show: true
              title: Living Room Temperature
            graph_span: 24h
            series:
              - entity: climate.living_room_ac_living_room_ac_thermostat
                attribute: current_temperature
                name: Current
              - entity: climate.living_room_ac_living_room_ac_thermostat
                attribute: temperature
                name: Target
    subview: true
    type: sections
