title: Shared Spaces
icon: mdi:sofa
require_admin: false
show_in_sidebar: true
views:
  - title: Shared Spaces
    sections:
      - cards:
          - heading: All Lights
            type: heading
          - entity: light.all_govee_lights
            name: All Govee Lights
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
      - cards:
          - heading: All Devices
            type: heading
          - type: horizontal-stack
            cards:
              - type: button
                name: All On
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_on
                  target:
                    label_id: shared_space
              - type: button
                name: All Off
                icon: mdi:power-off
                tap_action:
                  action: perform-action
                  perform_action: homeassistant.turn_off
                  target:
                    label_id: shared_space
      - cards:
          - heading: Scenes
            type: heading
          - type: horizontal-stack
            cards:
              - type: button
                name: Cooking
                icon: mdi:stove
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.shared_cooking
              - type: button
                name: Dinner
                icon: mdi:food-fork-drink
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.shared_dinner
              - type: button
                name: Movie
                icon: mdi:movie
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.living_room_movie
      - cards:
          - heading: Adaptive Lighting
            type: heading
          - entity: switch.adaptive_lighting_all_dimmable_lights_sleep_mode
            name: Sleep Mode
            features:
              - type: toggle
            type: tile
          - entity: switch.adaptive_lighting_all_dimmable_lights_adapt_brightness
            name: Adapt Brightness
            features:
              - type: toggle
            type: tile
          - entity: switch.adaptive_lighting_all_dimmable_lights_adapt_color
            name: Adapt Color
            features:
              - type: toggle
            type: tile
      - cards:
          - heading: All Shared Devices (auto)
            type: heading
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - label: shared_space
                  domain: light
                - label: shared_space
                  domain: switch
      - cards:
          - heading: Rooms
            type: heading
          - name: Stairs
            icon: mdi:stairs
            entity: switch.stairs_light
            hold_action:
              action: toggle
            show_state: true
            tap_action:
              action: navigate
              navigation_path: /shared-spaces/stairs
            type: button
          - name: Kitchen
            icon: mdi:stove
            tap_action:
              action: navigate
              navigation_path: /shared-spaces/kitchen
            type: button
          - name: Living Room
            icon: mdi:sofa
            tap_action:
              action: navigate
              navigation_path: /shared-spaces/living-room
            type: button
    type: sections
  - title: Stairs
    path: stairs
    sections:
      - cards:
          - heading: Stairs
            type: heading
          - name: Stairs Light
            entity: switch.stairs_light
            features:
              - type: toggle
            type: tile
    subview: true
    type: sections
  - title: Kitchen
    path: kitchen
    sections:
      - cards:
          - heading: Kitchen
            type: heading
          - entity: light.kitchen_lights
            name: All Kitchen Lights
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: light.kitchen_light
            name: Kitchen Light
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: light.kitchen_light_2
            name: Kitchen Light 2
            features:
              - type: light-brightness
              - type: light-color-temp
            type: tile
          - entity: switch.kitchen_mushroom_lamp
            name: Mushroom Lamp
            features:
              - type: toggle
            type: tile
          - entity: scene.shared_cooking
            name: Cooking Scene
            icon: mdi:stove
            type: tile
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.shared_cooking
          - entity: scene.shared_dinner
            name: Dinner Scene
            icon: mdi:food-fork-drink
            type: tile
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.shared_dinner
    subview: true
    type: sections
  - title: Living Room
    path: living-room
    sections:
      - cards:
          - heading: Living Room
            type: heading
          - entity: switch.living_room_good_vibes_sign
            features:
              - type: toggle
            type: tile
          - entity: light.living_room_lights
            name: All Living Room Lights
            fill_container: true
            type: custom:mushroom-light-card
          - entity: light.living_room_mushroom_lamp
            name: Floor Lamp
            fill_container: true
            type: custom:mushroom-light-card
          - entity: light.living_room_tulip_lamp
            name: Tulip Lamp
            fill_container: true
            type: custom:mushroom-light-card
          - entity: climate.living_room_ac_living_room_ac_thermostat
            fill_container: true
            type: custom:mushroom-climate-card
          - entity: scene.living_room_movie
            name: Movie Scene
            icon: mdi:movie
            type: tile
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.living_room_movie
          - type: custom:apexcharts-card
            header:
              title: Living Room Temperature
            graph_span: 24h
            series:
              - entity: climate.living_room_ac_living_room_ac_thermostat
                attribute: current_temperature
                name: Current
              - entity: climate.living_room_ac_living_room_ac_thermostat
                attribute: temperature
                name: Target
    subview: true
    type: sections
