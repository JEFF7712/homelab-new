title: 3D Printing
icon: mdi:printer-3d
require_admin: false
show_in_sidebar: true
button_card_templates:
  mobile_nav_button:
    show_name: false
    show_state: false
    size: 22px
    aspect_ratio: 1/1
    styles:
      card:
        - height: 40px
        - width: 40px
        - margin: 0
        - padding: 10px
        - overflow: visible
        - border-radius: 500px
        - background: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(255, 183, 77, 0.95)'
                : 'transparent';
            ]]]
      icon:
        - height: 100%
        - width: 100%
        - color: |
            [[[
              return window.location.pathname.includes(variables.path)
                ? 'rgba(20, 20, 20, 0.95)'
                : 'var(--secondary-text-color)';
            ]]]
views:
  - title: A1
    type: sections
    footer:
      max_width: 400
      card:
        type: custom:button-card
        show_name: false
        show_icon: false
        show_label: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - background: var(--ha-card-background)
            - backdrop-filter: var(--ha-card-backdrop-filter)
            - -webkit-backdrop-filter: var(--ha-card-backdrop-filter)
            - border-radius: 40px
            - border: var(--ha-card-border-width) solid var(--ha-card-border-color)
            - box-shadow: var(--ha-card-box-shadow), var(--ha-card-glass-inset-shadow)
            - padding: 10px
            - margin: 0 auto 4px auto
            - height: 60px
            - width: 310px
            - overflow: visible
            - --mdc-ripple-color: transparent
            - position: fixed
            - bottom: max(12px, env(safe-area-inset-bottom))
            - left: 50%
            - transform: translateX(-50%)
            - z-index: 20
          grid:
            - display: grid
            - grid-template-areas: '"b1 b2 b3 b4 b5"'
            - grid-template-columns: 1fr 1fr 1fr 1fr 1fr
            - align-items: center
            - column-gap: 14px
            - justify-content: center
          custom_fields:
            b1:
              - justify-self: center
            b2:
              - justify-self: center
            b3:
              - justify-self: center
            b4:
              - justify-self: center
            b5:
              - justify-self: center
        custom_fields:
          b1:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: home-overview
              icon: mdi:home
              tap_action:
                action: navigate
                navigation_path: /home-overview
          b2:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: bedroom-lights
              icon: mdi:bed
              tap_action:
                action: navigate
                navigation_path: /bedroom-lights
          b3:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: shared-spaces
              icon: mdi:sofa
              tap_action:
                action: navigate
                navigation_path: /shared-spaces
          b4:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: 3d-printing
              icon: mdi:printer-3d
              tap_action:
                action: navigate
                navigation_path: /3d-printing
          b5:
            card:
              type: custom:button-card
              template: mobile_nav_button
              variables:
                path: map
              icon: mdi:map
              tap_action:
                action: navigate
                navigation_path: /map
    sections:
      - cards:
          - type: custom:mushroom-title-card
            title: A1
          - type: custom:mushroom-template-card
            entity: sensor.a1_03900d642327265_print_status
            primary: '{{ states(''sensor.a1_03900d642327265_task_name'') | default(''A1'', true) }}'
            secondary: >-
              {% set stage = states('sensor.a1_03900d642327265_current_stage') %}
              {% set prog = states('sensor.a1_03900d642327265_print_progress') %}
              {% set raw = states('sensor.a1_03900d642327265_remaining_time') %}
              {% if raw not in ('unknown', 'unavailable', 'none') %}
              {% set mins = (raw | float(0) * 60) | int %}
              {% set h = mins // 60 %}{% set m = mins % 60 %}
              {{ stage | capitalize }} - {{ prog }}% - {% if h > 0 %}{{ h }}h {% endif %}{{ m }}m left
              {% else %}
              {{ stage | capitalize }} - {{ prog }}%
              {% endif %}
            icon: mdi:printer-3d
            icon_color: >-
              {% if is_state('binary_sensor.a1_03900d642327265_print_error', 'on') %}
              red
              {% elif is_state('sensor.a1_03900d642327265_print_status', 'running') %}
              green
              {% elif is_state('sensor.a1_03900d642327265_print_status', 'finish') %}
              blue
              {% elif is_state('sensor.a1_03900d642327265_print_status', 'pause') %}
              orange
              {% else %}
              grey
              {% endif %}
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: picture-entity
            entity: camera.a1_03900d642327265_camera
            name: A1 Camera
            show_state: false
            camera_view: auto
            tap_action:
              action: more-info
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: sensor.a1_03900d642327265_print_status
                content_info: state
                tap_action:
                  action: more-info
              - type: entity
                entity: sensor.a1_03900d642327265_print_progress
                content_info: state
                tap_action:
                  action: more-info
              - type: entity
                entity: sensor.a1_03900d642327265_remaining_time
                content_info: state
                tap_action:
                  action: more-info
              - type: entity
                entity: binary_sensor.a1_03900d642327265_print_error
                content_info: state
                tap_action:
                  action: more-info
              - type: entity
                entity: binary_sensor.a1_03900d642327265_online
                content_info: state
                tap_action:
                  action: more-info
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                entity: button.a1_03900d642327265_pause
                primary: Pause
                icon: mdi:pause
                icon_color: orange
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.a1_03900d642327265_pause
              - type: custom:mushroom-template-card
                entity: button.a1_03900d642327265_resume
                primary: Resume
                icon: mdi:play
                icon_color: green
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.a1_03900d642327265_resume
              - type: custom:mushroom-template-card
                entity: button.a1_03900d642327265_stop
                primary: Stop
                icon: mdi:stop
                icon_color: red
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.a1_03900d642327265_stop
          - type: custom:mushroom-light-card
            entity: light.a1_03900d642327265_chamber_light
            name: Chamber light
            show_brightness_control: false
            collapsible_controls: true
          - type: custom:mushroom-fan-card
            entity: fan.a1_03900d642327265_cooling_fan
            name: Cooling fan
            show_percentage_control: true
            collapsible_controls: true
      - cards:
          - type: custom:mushroom-title-card
            title: Temperatures
            subtitle: Nozzle and bed, last 12 hours
          - type: custom:apexcharts-card
            header:
              show: true
              title: Nozzle and bed temperatures
              show_states: true
              colorize_states: true
            graph_span: 12h
            cache: true
            update_interval: 60s
            span:
              start: hour
              offset: -12h
            yaxis:
              - min: 0
                decimals: 0
            apex_config:
              chart:
                height: 260
              stroke:
                curve: smooth
                width: 2
              legend:
                show: true
              tooltip:
                enabled: true
              grid:
                show: true
            series:
              - entity: sensor.a1_03900d642327265_nozzle_temperature
                name: Nozzle
                color: '#ff6b35'
                stroke_width: 2
                curve: smooth
                show:
                  legend_value: true
              - entity: sensor.a1_03900d642327265_bed_temperature
                name: Bed
                color: '#36a2eb'
                stroke_width: 2
                curve: smooth
                show:
                  legend_value: true
              - entity: sensor.a1_03900d642327265_nozzle_target_temperature
                name: Nozzle target
                color: '#ffb07a'
                stroke_width: 1
                curve: stepline
                opacity: 0.5
                show:
                  legend_value: true
              - entity: sensor.a1_03900d642327265_bed_target_temperature
                name: Bed target
                color: '#90caf9'
                stroke_width: 1
                curve: stepline
                opacity: 0.5
                show:
                  legend_value: true
          - type: custom:apexcharts-card
            header:
              show: true
              title: Progress and fans
              show_states: true
              colorize_states: true
            graph_span: 12h
            cache: true
            update_interval: 60s
            span:
              start: hour
              offset: -12h
            yaxis:
              - min: 0
                max: 100
                decimals: 0
            apex_config:
              chart:
                height: 200
              stroke:
                curve: smooth
                width: 2
              legend:
                show: true
            series:
              - entity: sensor.a1_03900d642327265_print_progress
                name: Progress
                color: '#4caf50'
                stroke_width: 2
                curve: smooth
                show:
                  legend_value: true
              - entity: sensor.a1_03900d642327265_cooling_fan_speed
                name: Cooling fan
                color: '#9c27b0'
                stroke_width: 2
                curve: smooth
                show:
                  legend_value: true
              - entity: sensor.a1_03900d642327265_heatbreak_fan_speed
                name: Heatbreak fan
                color: '#ff9800'
                stroke_width: 2
                curve: smooth
                show:
                  legend_value: true
          - type: custom:mushroom-title-card
            title: Controls
            subtitle: Targets and switches
          - type: custom:mushroom-number-card
            entity: number.a1_03900d642327265_nozzle_target_temperature
            name: Nozzle target
            display_mode: slider
          - type: custom:mushroom-number-card
            entity: number.a1_03900d642327265_bed_target_temperature
            name: Bed target
            display_mode: slider
          - type: custom:mushroom-entity-card
            entity: sensor.a1_03900d642327265_current_layer
            name: Current layer
            icon_color: grey
          - type: custom:mushroom-entity-card
            entity: sensor.a1_03900d642327265_wi_fi_signal
            name: Wi-Fi signal
            icon_color: blue
          - type: entities
            title: Print details
            entities:
              - entity: sensor.a1_03900d642327265_task_name
                name: File
              - entity: sensor.a1_03900d642327265_total_layer_count
                name: Total layers
              - entity: sensor.a1_03900d642327265_print_weight
                name: Filament used
              - entity: sensor.a1_03900d642327265_print_length
                name: Filament length
              - entity: sensor.a1_03900d642327265_end_time
                name: Finishes at
