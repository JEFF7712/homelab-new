alias: "Bedroom: Lights Off"
description: "Turn off all bedroom plugs and lamps."
sequence:
  - action: switch.turn_off
    target:
      entity_id:
        - switch.bedroom_window_plug
        - switch.bedroom_mushroom_plug
  - action: light.turn_off
    target:
      entity_id:
        - light.desk_lamp_desk_lamp
        - light.floor_lamp_floor_lamp
        - light.light_strip_light_strip
mode: single
