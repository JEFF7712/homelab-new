alias: "Effects: Candlelight Dinner"
description: >-
  Run the Govee Candlelight effect on kitchen and living room bulbs.
  Re-tap any static scene or toggle a bulb off and on to return it to
  Adaptive Lighting.
sequence:
  - action: light.turn_on
    target:
      entity_id:
        - light.kitchen_lights
        - light.living_room_lights
    data:
      effect: Candlelight
mode: single
