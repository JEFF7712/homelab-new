alias: "Shared: Lights On"
description: >-
  Restore the snapshot taken by "Shared: Lights Off" so the lights and plugs
  return to their exact prior brightness and color. The restored lights are
  marked manually controlled so Adaptive Lighting (including sleep mode)
  leaves them alone until the next off/on cycle. Falls back to turning on
  everything in the shared_space label when no snapshot exists yet, e.g.
  after a restart.
sequence:
  - if:
      - condition: template
        value_template: "{{ state_attr('scene.shared_last_state', 'entity_id') is not none }}"
    then:
      - action: scene.turn_on
        target:
          entity_id: scene.shared_last_state
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_all_dimmable_lights
          lights:
            - light.kitchen_light
            - light.kitchen_light_2
            - light.living_room_mushroom_lamp
            - light.living_room_tulip_lamp
          manual_control: true
    else:
      - action: homeassistant.turn_on
        target:
          label_id: shared_space
mode: single
