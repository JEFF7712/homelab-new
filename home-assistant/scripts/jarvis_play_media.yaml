alias: Jarvis — play media via Spotify
description: >-
  Plays music, songs, artists, albums, or playlists on the Jarvis satellite
  speaker via Music Assistant / Spotify. Call this script whenever the user
  asks to play music, a song, an artist, a playlist, or an album. Pass
  media_content_type='music' and media_content_id set to the search query
  or artist name.
fields:
  media_content_type:
    description: >-
      `music` for free-text search (artist or track); `playlist`, `artist`,
      `album`, `track` for typed lookups.
    example: music
    required: true
    selector:
      select:
        options:
          - music
          - playlist
          - artist
          - album
          - track
  media_content_id:
    description: >-
      Free-text search (e.g. "The Weeknd"), Spotify URI (e.g.
      `spotify:artist:1Xyo4u8dXCvp56eB51DXfh`), or full Spotify URL.
    example: The Weeknd
    required: true
    selector:
      text: {}
sequence:
  - action: media_player.play_media
    target:
      entity_id: media_player.homelab_05_satellite_media_player_2
    data:
      media_content_type: "{{ media_content_type }}"
      media_content_id: "{{ media_content_id }}"
  - variables:
      playback_result:
        media: "{{ media_content_id }}"
        status: playing
  - stop: Playback started
    response_variable: playback_result
