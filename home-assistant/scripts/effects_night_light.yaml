alias: "Effects: Night Light"
description: >-
  Run the dim warm Govee Night Light effect on the kitchen bulbs for the
  late-night path. Re-tap any static scene or toggle a bulb off and on
  to return it to Adaptive Lighting.
sequence:
  - action: light.turn_on
    target:
      entity_id: light.kitchen_lights
    data:
      effect: Night Light
mode: single
