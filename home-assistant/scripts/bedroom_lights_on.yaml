alias: "Bedroom: Evening Lights On"
description: >-
  Turn on bedroom plugs and lamps with plain turn_on calls. Brightness and
  color temperature are owned by Adaptive Lighting.
sequence:
  - action: switch.turn_on
    target:
      entity_id:
        - switch.bedroom_window_plug
        - switch.bedroom_mushroom_plug
  - action: light.turn_on
    target:
      entity_id:
        - light.desk_lamp_desk_lamp
        - light.floor_lamp_floor_lamp
        - light.light_strip_light_strip
mode: single
