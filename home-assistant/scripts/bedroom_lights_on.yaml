alias: "Bedroom: Evening Lights On"
description: >-
  Restore the snapshot taken by "Bedroom: Lights Off" so the lamps and plugs
  return to their exact prior brightness and color, but only when everything
  is currently off. When anything is already on (e.g. a scene was just
  activated) the stale snapshot is skipped and everything is simply turned
  on, so All On never turns lights off. The restored lamps are marked
  manually controlled so Adaptive Lighting (including sleep mode) leaves them
  alone until the next off/on cycle. Falls back to plain turn_on (brightness
  and color temperature owned by Adaptive Lighting) when no snapshot exists
  yet, e.g. after a restart.
sequence:
  - if:
      - condition: template
        value_template: "{{ state_attr('scene.bedroom_last_state', 'entity_id') is not none }}"
      - condition: template
        value_template: >-
          {{ expand('light.desk_lamp_desk_lamp', 'light.floor_lamp_floor_lamp',
          'light.light_strip_light_strip', 'switch.bedroom_window_plug',
          'switch.bedroom_mushroom_plug')
          | selectattr('state', 'eq', 'on') | list | count == 0 }}
    then:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_all_dimmable_lights
          lights:
            - light.desk_lamp_desk_lamp
            - light.floor_lamp_floor_lamp
            - light.light_strip_light_strip
          manual_control: true
      - action: scene.turn_on
        target:
          entity_id: scene.bedroom_last_state
    else:
      - action: switch.turn_on
        target:
          entity_id:
            - switch.bedroom_window_plug
            - switch.bedroom_mushroom_plug
      - action: light.turn_on
        target:
          entity_id:
            - light.desk_lamp_desk_lamp
            - light.floor_lamp_floor_lamp
            - light.light_strip_light_strip
mode: single
