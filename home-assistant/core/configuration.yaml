default_config:
homeassistant:
  external_url: https://ha.rupan.dev
frontend:
  themes: !include_dir_merge_named themes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
light:
  - platform: group
    name: Kitchen Lights
    entities:
      - light.kitchen_light
      - light.kitchen_light_2
  - platform: group
    name: Living Room Lights
    entities:
      - light.living_room_mushroom_lamp
      - light.living_room_tulip_lamp
  - platform: group
    name: All Govee Lights
    entities:
      - light.kitchen_light
      - light.kitchen_light_2
      - light.living_room_mushroom_lamp
      - light.living_room_tulip_lamp
  - platform: group
    name: Bedroom Roku Lights
    entities:
      - light.desk_lamp_desk_lamp
      - light.floor_lamp_floor_lamp
      - light.light_strip_light_strip
  - platform: switch
    name: Bedroom Window Plug
    entity_id: switch.bedroom_window_plug
  - platform: switch
    name: Bedroom Mushroom Plug
    entity_id: switch.bedroom_mushroom_plug
  - platform: switch
    name: Living Room Good Vibes Sign
    entity_id: switch.living_room_good_vibes_sign
homekit:
  - name: Homelab Bridge
    port: 21063
    advertise_ip: 10.0.40.13
    filter:
      include_domains:
        - light
      include_entities:
        - switch.bedroom_window_plug
        - switch.bedroom_mushroom_plug
        - switch.living_room_good_vibes_sign
        - switch.stairs_light
        - climate.living_room_ac_living_room_ac_thermostat
      exclude_entities:
        - light.a1_03900d642327265_chamber_light
recorder:
  db_url: !secret recorder_db_url
rest:
  - resource: https://version.home-assistant.io/stable.json
    scan_interval: 21600
    sensor:
      - name: HA latest version
        value_template: "{{ value_json.homeassistant.default }}"
