# Public routes on the shared homelab gateway. Internal-only services
# (prowlarr, flaresolverr, subgen) have no route by design.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
spec:
  parentRefs:
    - name: homelab
      namespace: default
  hostnames:
    - sonarr.rupan.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sonarr
          port: 80
---
