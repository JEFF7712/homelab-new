apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        checksum/config: 7ee185f9eddb612974fef0c0b1eb7d1ddd1cbf06d3dae45aed7f65cb1765250b
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-config
          image: registry.rupan.dev/upstream/docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616  # yamllint disable-line rule:line-length
          command:
            - /bin/sh
            - -ec
            - |
              cp /bootstrap/configuration.yaml /config/configuration.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: bootstrap-config
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: home-assistant
          image: registry.rupan.dev/upstream/ghcr.io/home-assistant/home-assistant@sha256:31076d37e3b7dc9681b32d892aa4413fa866c9a90e5c8a50324b397dce415d17  # yamllint disable-line rule:line-length
          env:
            - name: TZ
              value: America/Chicago
          ports:
            - name: http
              containerPort: 8123
            - name: hap
              containerPort: 21063
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /manifest.json
              port: http
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
        - name: matter-server
          image: registry.rupan.dev/upstream/ghcr.io/home-assistant-libs/python-matter-server@sha256:ac6f5cf1649fa6bdfde7dce6218e9bc126119cc9b324019ad389872e83f5c093  # yamllint disable-line rule:line-length
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: matter-server-data
              mountPath: /data
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: bootstrap-config
          configMap:
            name: home-assistant-config
        - name: secrets
          secret:
            secretName: home-assistant-secrets
        - name: tmp
          emptyDir: {}
        - name: matter-server-data
          persistentVolumeClaim:
            claimName: home-assistant-matter-server
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
