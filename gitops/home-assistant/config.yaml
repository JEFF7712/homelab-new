apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:
    homeassistant:
      external_url: https://ha.rupan.dev
      auth_providers:
        - type: homeassistant
        - type: trusted_networks
          trusted_networks:
            - 10.0.30.15/32
            - 127.0.0.1
          trusted_users:
            10.0.30.15: 8415ac1522be4ac5a1a5460a40e5127f
          allow_bypass_login: true
    frontend:
      themes: !include_dir_merge_named themes
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
    intent_script:
      JarvisSignatureColor:
        action:
          - service: light.turn_on
            target:
              entity_id: "{{ jarvis_light }}"
            data:
              rgb_color: [255, 16, 240]
        speech:
          text: "Done."
      JarvisBrightnessNudge:
        action:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ jarvis_direction == 'decrease' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: light.downstairs_lights
                    data:
                      brightness_step_pct: -30
            default:
              - service: light.turn_on
                target:
                  entity_id: light.downstairs_lights
                data:
                  brightness_step_pct: 30
        speech:
          text: "Done."
      JarvisMovieMode:
        action:
          - service: scene.turn_on
            target:
              entity_id: scene.movie_low_living_room
        speech:
          text: "Done."
      JarvisWhatsPlaying:
        speech:
          text: >-
            {% set title = state_attr('media_player.homelab_05_satellite_media_player_2', 'media_title') %}
            {% set artist = state_attr('media_player.homelab_05_satellite_media_player_2', 'media_artist') %}
            {% if title %}{{ title }}{% if artist %} by {{ artist }}{% endif %}{% else %}Nothing is playing.{% endif %}
      JarvisTempDownstairs:
        speech:
          text: "{{ states('sensor.living_room_ac_ambient_temperature_degf') }} degrees."
      JarvisKitchenLightsState:
        speech:
          text: "{% if is_state('light.kitchen_lights', 'on') %}Yes.{% else %}No.{% endif %}"
      JarvisAcState:
        speech:
          text: "{% if states('sensor.living_room_ac_mode') == 'off' %}No.{% else %}Yes.{% endif %}"
    light:
      - platform: group
        name: Kitchen Lights
        entities:
          - light.kitchen_light
          - light.kitchen_light_2
      - platform: group
        name: Living Room Lights
        entities:
          - light.living_room_mushroom_lamp
          - light.living_room_tulip_lamp
      - platform: group
        name: All Govee Lights
        entities:
          - light.kitchen_light
          - light.kitchen_light_2
          - light.living_room_mushroom_lamp
          - light.living_room_tulip_lamp
      - platform: group
        name: Bedroom Roku Lights
        entities:
          - light.desk_lamp_desk_lamp
          - light.floor_lamp_floor_lamp
          - light.light_strip_light_strip
      - platform: group
        name: Downstairs Lights
        entities:
          - light.kitchen_light
          - light.kitchen_light_2
          - light.kitchen_mushroom_lamp
          - light.living_room_mushroom_lamp
          - light.living_room_tulip_lamp
      - platform: switch
        name: Bedroom Window Plug
        entity_id: switch.bedroom_window_plug
      - platform: switch
        name: Bedroom Mushroom Plug
        entity_id: switch.bedroom_mushroom_plug
      - platform: switch
        name: Living Room Good Vibes Sign
        entity_id: switch.living_room_good_vibes_sign
      - platform: switch
        name: Kitchen Mushroom Lamp
        entity_id: switch.kitchen_mushroom_lamp
    homekit:
      - name: Homelab Bridge
        port: 21063
        advertise_ip: 10.0.40.13
        filter:
          include_entities:
            - light.kitchen_lights
            - light.living_room_lights
            - light.bedroom_roku_lights
            - light.kitchen_light
            - light.kitchen_light_2
            - light.living_room_mushroom_lamp
            - light.living_room_tulip_lamp
            - light.desk_lamp_desk_lamp
            - light.floor_lamp_floor_lamp
            - light.light_strip_light_strip
            - light.bedroom_window_plug
            - light.bedroom_mushroom_plug
            - light.living_room_good_vibes_sign
            - light.kitchen_mushroom_lamp
            - switch.stairs_light
            - climate.living_room_ac_living_room_ac_thermostat
    recorder:
      db_url: !secret recorder_db_url
      purge_keep_days: 10
      commit_interval: 5
      auto_purge: true
      auto_repack: true
      exclude:
        entity_globs:
          - sensor.sm_s948u1_app_*
          - sensor.sm_s948u1_volume_*
          - sensor.rupan_phone_app_*
          - sensor.*_rx_gb
          - sensor.*_tx_gb
          - sensor.*_last_*
          - sensor.*_linkquality
          - sensor.*_power_factor
          - sensor.sun_solar_*
          - sensor.ha_latest_version
        entities:
          - sensor.ha_latest_version
        event_types:
          - call_service
    history:
      exclude:
        entity_globs:
          - sensor.sm_s948u1_app_*
          - sensor.sm_s948u1_volume_*
          - sensor.rupan_phone_app_*
          - sensor.*_rx_gb
          - sensor.*_tx_gb
          - sensor.*_last_*
          - sensor.*_linkquality
    logbook:
      exclude:
        entity_globs:
          - sensor.sm_s948u1_app_*
          - sensor.*_linkquality
    rest:
      - resource: https://version.home-assistant.io/stable.json
        scan_interval: 21600
        sensor:
          - name: HA latest version
            value_template: "{{ value_json.homeassistant.default }}"
  en.jarvis_colors.yaml: |
    language: en
    intents:
      JarvisSignatureColor:
        data:
          - sentences:
              - "(make|set|turn) [the] {jarvis_light} [light|lamp|lights] {jarvis_color}"
              - "[make] [the] {jarvis_light} [light|lamp|lights] {jarvis_color}"
              - "(set|turn) [the] {jarvis_light} [light|lamp|lights] to {jarvis_color}"
    lists:
      jarvis_light:
        values:
          - in: "downstairs"
            out: "light.downstairs_lights"
          - in: "downstairs lights"
            out: "light.downstairs_lights"
          - in: "kitchen"
            out: "light.kitchen_lights"
          - in: "kitchen lights"
            out: "light.kitchen_lights"
          - in: "living room"
            out: "light.living_room_lights"
          - in: "living room lights"
            out: "light.living_room_lights"
          - in: "bedroom"
            out: "light.bedroom_roku_lights"
          - in: "bedroom lights"
            out: "light.bedroom_roku_lights"
          - in: "govee"
            out: "light.all_govee_lights"
          - in: "all govee lights"
            out: "light.all_govee_lights"
          - in: "kitchen mushroom lamp"
            out: "light.kitchen_mushroom_lamp"
          - in: "bedroom window plug"
            out: "light.bedroom_window_plug"
          - in: "bedroom mushroom plug"
            out: "light.bedroom_mushroom_plug"
          - in: "good vibes sign"
            out: "light.living_room_good_vibes_sign"
      jarvis_color:
        values:
          - in: "neon pink"
            out: "neon_pink"
          - in: "hot pink"
            out: "neon_pink"
  en.jarvis_home.yaml: |
    language: en
    intents:
      JarvisMovieMode:
        data:
          - sentences:
              - "(set up|start) movie mode [in the living room]"
              - "movie mode"
              - "turn on movie mode [in the living room]"
      JarvisWhatsPlaying:
        data:
          - sentences:
              - "what's playing"
              - "what is playing"
              - "what's on [the speaker]"
      JarvisTempDownstairs:
        data:
          - sentences:
              - "what's the temperature downstairs"
              - "what is the temperature downstairs"
              - "how warm is it downstairs"
              - "how warm is it down here"
      JarvisKitchenLightsState:
        data:
          - sentences:
              - "are the kitchen lights on"
              - "are the kitchen lights off"
      JarvisAcState:
        data:
          - sentences:
              - "is the ac on"
              - "is the air conditioning on"
              - "is the living room ac on"
  en.jarvis_nudge.yaml: |
    language: en
    intents:
      JarvisBrightnessNudge:
        data:
          - sentences:
              - "(make|turn) it {jarvis_direction} down here"
              - "(make|turn) it {jarvis_direction} downstairs"
    lists:
      jarvis_direction:
        values:
          - in: "darker"
            out: "decrease"
          - in: "brighter"
            out: "increase"
  en.jarvis_terse.yaml: |
    language: en
    responses:
      intents:
        HassTurnOn:
          default: Done.
        HassTurnOff:
          default: Done.
        HassToggle:
          default: Done.
        HassLightSet:
          default: Done.
