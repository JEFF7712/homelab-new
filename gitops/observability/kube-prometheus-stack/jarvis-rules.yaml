apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jarvis-voice
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: jarvis.voice
      rules:
        - alert: JarvisExporterDisconnected
          expr: jarvis_exporter_ha_connected == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Jarvis exporter is disconnected from Home Assistant
            description: The exporter has not held an authenticated HA websocket for 5 minutes.
        - alert: JarvisExporterSubscriptionStale
          expr: >-
            jarvis_exporter_last_event_age_seconds > 120 or
            jarvis_exporter_subscription_state{state!="subscribed"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Jarvis exporter subscription is stale
            description: Jarvis telemetry is not receiving a healthy subscribed event stream.
        - alert: JarvisExporterMissing
          expr: absent(jarvis_exporter_ha_connected)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Jarvis exporter metrics are absent
            description: The exporter pod or ServiceMonitor may be gone; no scrape at all.
        - alert: JarvisExporterAuthFailures
          expr: increase(jarvis_exporter_auth_failures_total[15m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Jarvis exporter authentication failures detected
            description: HA token may be revoked or rotated incorrectly.
        - alert: JarvisZeroTurns
          expr: sum(increase(jarvis_requests_total[1h])) == 0 and jarvis_exporter_ha_connected == 1
          for: 1h
          labels:
            severity: info
          annotations:
            summary: No Jarvis voice turns in the last hour
            description: Satellite may be unhealthy or house is quiet; verify live state.
        - alert: JarvisSlowTurnRatio
          expr: >-
            sum(increase(jarvis_turn_speed_class_total{class="slow"}[1h]))
            / sum(increase(jarvis_turn_speed_class_total[1h]))
            > 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: High ratio of slow Jarvis turns
            description: More than 50% of turns exceed the fast threshold; check LLM/TTS latency.
