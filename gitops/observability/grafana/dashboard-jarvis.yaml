# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-jarvis
  namespace: observability
  labels:
    grafana_dashboard: '1'
data:
  jarvis.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Turn anatomy",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "Stage latency p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(jarvis_stt_latency_seconds_bucket[5m])))",
              "legendFormat": "STT (utterance + transcription)",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(jarvis_llm_latency_seconds_bucket[5m])))",
              "legendFormat": "LLM (processing)",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(jarvis_tts_latency_seconds_bucket[5m])))",
              "legendFormat": "TTS (responding)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "LLM latency distribution",
          "type": "heatmap",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "options": {
            "calculate": false,
            "color": {
              "mode": "scheme",
              "scheme": "Oranges"
            },
            "legend": {
              "show": true
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (le) (rate(jarvis_llm_latency_seconds_bucket[5m]))",
              "format": "heatmap",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Volume and reliability",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          }
        },
        {
          "id": 5,
          "title": "Requests (range)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(jarvis_requests_total[$__range]))",
              "legendFormat": "requests",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Failure share",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(jarvis_failed_requests_total[5m])) / clamp_min(sum(rate(jarvis_requests_total[5m])), 0.0001)",
              "legendFormat": "failures / requests",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Tool calls (range)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(jarvis_tool_calls_total[$__range]))",
              "legendFormat": "tools",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Exporter linked",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(jarvis_exporter_ha_connected)",
              "legendFormat": "linked",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Requests by room",
          "type": "bargauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (room) (increase(jarvis_requests_by_room_total[$__range]))",
              "legendFormat": "{{room}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "Request and failure rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(jarvis_requests_total[5m]))",
              "legendFormat": "requests/s",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(jarvis_failed_requests_total[5m]))",
              "legendFormat": "failures/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "Gateway fallback and TTS health",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "expr": "sum(rate(jarvis_gateway_fallbacks_total[5m])) by (mode, backend)",
              "legendFormat": "fallback {{mode}}/{{backend}}",
              "refId": "A"
            },
            {
              "expr": "sum(rate(jarvis_tts_synthesis_failures_total[5m])) by (backend)",
              "legendFormat": "TTS failure {{backend}}",
              "refId": "B"
            },
            {
              "expr": "max(jarvis_tts_unwatermarked_audio)",
              "legendFormat": "unwatermarked audio",
              "refId": "C"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "jarvis",
        "voice",
        "homelab"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Jarvis Voice",
      "uid": "jarvis-voice",
      "version": 1
    }
