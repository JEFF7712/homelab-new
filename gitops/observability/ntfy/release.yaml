apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: ntfy
      version: 1.2.2
      sourceRef:
        kind: HelmRepository
        name: helmforge
        namespace: flux-system
  values:
    ntfy:
      baseUrl: https://ntfy.rupan.dev
      authDefaultAccess: deny-all
      extraEnv:
        - name: NTFY_AUTH_USERS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-users
        - name: NTFY_AUTH_TOKENS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-tokens
        - name: NTFY_AUTH_ACCESS
          valueFrom:
            secretKeyRef:
              name: ntfy-auth
              key: auth-access
    persistence:
      enabled: true
      size: 2Gi
      storageClass: nfs-cluster
    gateway:
      enabled: true
      parentRefs:
        - name: homelab
          namespace: default
      hostnames:
        - ntfy.rupan.dev
