apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: ntfy
      version: 1.2.2
      sourceRef:
        kind: HelmRepository
        name: helmforge
        namespace: flux-system
  values:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: nfs-cluster
    gateway:
      enabled: true
      parentRefs:
        - name: homelab
          namespace: default
      hostnames:
        - ntfy.homelab
