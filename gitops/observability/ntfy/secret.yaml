apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-auth
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitlab-project
  target:
    name: ntfy-auth
    creationPolicy: Owner
  data:
    - secretKey: ntfy-auth-users
      remoteRef:
        key: NTFY_AUTH_USERS
    - secretKey: ntfy-auth-tokens
      remoteRef:
        key: NTFY_AUTH_TOKENS
    - secretKey: ntfy-auth-access
      remoteRef:
        key: NTFY_AUTH_ACCESS
