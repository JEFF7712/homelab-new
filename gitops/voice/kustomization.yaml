apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voice
resources:
  - namespace.yaml
  - ollama.yaml
  - local-decision.yaml
  - whisper.yaml
  - piper.yaml
  - satellite.yaml
  - exporter.yaml

configMapGenerator:
  - name: wyoming-voice-id-config
    files:
      - voice-id/proxy.py
      - voice-id/profiles.json
  - name: local-decision-runtime
    files:
      - local-decision/app.py
      - local-decision/pyproject.toml
      - local-decision/uv.lock
