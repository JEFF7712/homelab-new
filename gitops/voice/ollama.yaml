      labels:
        app: ollama-model-ready
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: homelab-04
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: pull
          # Pinned upstream tag: 0.34.1
          image: docker.io/ollama/ollama@sha256:0c0a83210471fb50226bcdc2d6611d20ab13ae87e024cc304c94a6a5765c5e65  # yamllint disable-line rule:line-length
          env:
            - name: OLLAMA_HOST
              value: "http://ollama.voice:11434"
          args:
            - "pull"
