apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: distrojeff-site-route
  namespace: distrojeff
spec:
  parentRefs:
    - name: homelab
      namespace: default
  hostnames:
    - distrojeff.com
    - www.distrojeff.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: distrojeff-site-svc
          port: 80
