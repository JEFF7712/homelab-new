apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deploy
  namespace: soluble-rupan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soluble-rupan-web
  template:
    metadata:
      labels:
        app: soluble-rupan-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/jeff7712/solubility-gnn:0.0.46
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      volumes:
        - name: tmp
          emptyDir: {}
