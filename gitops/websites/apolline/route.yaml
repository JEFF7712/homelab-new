apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apolline-route
  namespace: apolline
spec:
  parentRefs:
    - name: homelab
      namespace: default
  hostnames:
    - apollinestore.com
    - www.apollinestore.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: apolline-svc
          port: 80
