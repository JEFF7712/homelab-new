apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  namespace: music-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: homelab-05
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/music-assistant/server:2.10.3@sha256:885872224fa541c0faefc936625c939ba705a00e89c180f89e877f58448ea5d5  # yamllint disable-line rule:line-length
          env:
            - name: TZ
              value: America/Chicago
            - name: LOG_LEVEL
              value: info
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    if [ ! -f /usr/local/bin/go-librespot.orig ]; then
                      mv /usr/local/bin/go-librespot /usr/local/bin/go-librespot.orig
                      printf '%s\n' \
                        '#!/bin/sh' \
                        'exec /usr/local/bin/go-librespot.orig \' \
                        '  -c zeroconf_port=38801 \' \
                        '  -c zeroconf_interfaces_to_advertise=enp0s31f6 \' \
                        '  "$@"' > /usr/local/bin/go-librespot
                      chmod +x /usr/local/bin/go-librespot
                    fi
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: pot-provider
          image: docker.io/brainicism/bgutil-ytdlp-pot-provider:1.3.2@sha256:9a96e6385ce1928da87dea07b1cab0413d2cf8c07a3b8a8bd419f53df2c3843c  # yamllint disable-line rule:line-length
          ports:
            - containerPort: 4416
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data
