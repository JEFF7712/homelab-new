apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-gitlab
  namespace: automation
spec:
  interval: 1h
  chart:
    spec:
      chart: renovate
      version: 45.64.2
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  values:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    renovate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      config: |
        {
          "platform": "gitlab",
          "endpoint": "https://gitlab.com/api/v4",
          "autodiscover": true,
          "autodiscoverFilter": [
            "jeff7712/homelab-new",
            "JEFF7712/homelab-new"
          ],
          "onboarding": false,
          "requireConfig": "optional"
        }
    cronjob:
      schedule: "0 * * * *"
      concurrencyPolicy: Forbid
    envList:
      - name: LOG_LEVEL
        value: info
      - name: RENOVATE_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-secrets
            key: gitlab-token
      - name: GITHUB_COM_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-secrets
            key: github-token
