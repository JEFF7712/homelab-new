apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-github
  namespace: automation
spec:
  interval: 1h
  chart:
    spec:
      chart: renovate
      version: 46.283.0
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  values:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    renovate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      config: |
        {
          "platform": "github",
          "endpoint": "https://api.github.com/",
          "autodiscover": true,
          "autodiscoverFilter": [
            "jeff7712/apolline-site",
            "jeff7712/darkbit-site",
            "jeff7712/distrojeff-site",
            "jeff7712/pulse",
            "jeff7712/rupanism",
            "jeff7712/solubility-predictor",
            "jeff7712/obsidian-vault"
          ],
          "onboarding": true,
          "onboardingConfig": {
            "extends": ["config:recommended"]
          }
        }
    cronjob:
      schedule: "30 */2 * * *"
      concurrencyPolicy: Forbid
    envList:
      - name: LOG_LEVEL
        value: info
      - name: RENOVATE_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-secrets
            key: github-token
      - name: GITHUB_COM_TOKEN
        valueFrom:
          secretKeyRef:
            name: renovate-secrets
            key: github-token
