apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner
  namespace: storage
spec:
  interval: 1h
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
  postRenderers:
    - kustomize:
        images:
          - name: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner
            newName: registry.rupan.dev/upstream/registry.k8s.io/sig-storage/nfs-subdir-external-provisioner  # yamllint disable-line rule:line-length
            digest: sha256:63d5e04551ec8b5aae83b6f35938ca5ddc50a88d85492d9731810c31591fa4c9
  values:
    nfs:
      server: 10.0.30.20
      path: /tank/cluster
    storageClass:
      name: nfs-cluster
      defaultClass: true
      reclaimPolicy: Delete
