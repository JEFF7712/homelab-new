apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-local-repo
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-cluster
  resources:
    requests:
      storage: 500Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-backup-secrets
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitlab-project
  target:
    name: immich-backup-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: restic-password
      remoteRef:
        key: RESTIC_PASSWORD
