image: nixos/nix:latest

stages:
  - lint
  - test
  - security
  - opnsense
  - deploy

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  TF_STATE_NAME: opnsense-production
  TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_USERNAME: gitlab-ci-token
  TF_HTTP_PASSWORD: $CI_JOB_TOKEN
  TF_HTTP_LOCK_METHOD: POST
  TF_HTTP_UNLOCK_METHOD: DELETE
  TF_HTTP_RETRY_WAIT_MIN: "5"

nix_format:
  stage: lint
  script:
    - cd flake && nix fmt -- --check flake.nix

repository_tests:
  stage: test
  script:
    - nix develop ./flake -c python -m unittest discover -s tests -v
    - nix flake check ./flake

yaml_schema:
  stage: test
  script:
    - nix develop ./flake -c yamllint .

secret_scan:
  stage: security
  script:
    - nix develop ./flake -c gitleaks detect --source . --redact

opnsense_inventory:
  stage: opnsense
  tags:
    - nas
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - nix develop ./flake -c python -m opnsense_reconciler.inventory --artifact-dir artifacts/opnsense
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/opnsense/

opnsense_plan:
  stage: opnsense
  tags:
    - nas
  variables:
    # The firewall serves its default self-signed cert (SAN: OPNsense.internal,
    # no IP SANs) and the tofu provider has no TLS server-name override, so it
    # must address the firewall by its certificate DNS name, not the IP literal.
    OPNSENSE_URI: "https://OPNsense.internal"
    SSL_CERT_FILE: $OPNSENSE_CA_FILE
    TF_VAR_opnsense_uri: "https://OPNsense.internal"
  needs:
    - job: opnsense_inventory
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - >-
      test "$(nix develop ./flake -c python -c
      'import json;print(json.load(open("artifacts/opnsense/inventory.json"))["assignment_api_available"])')"
      = True
    - nix develop ./flake -c tofu -chdir=tofu/opnsense init -reconfigure
    - nix develop ./flake -c tofu -chdir=tofu/opnsense validate
    - nix develop ./flake -c tofu -chdir=tofu/opnsense plan -refresh-only -out=refresh-only.tfplan
    - nix develop ./flake -c tofu -chdir=tofu/opnsense plan -out=desired.tfplan
  artifacts:
    expire_in: 7 days
    paths:
      - tofu/opnsense/refresh-only.tfplan
      - tofu/opnsense/desired.tfplan

opnsense_apply:
  stage: opnsense
  tags:
    - nas
  variables:
    OPNSENSE_URI: "https://OPNsense.internal"
    SSL_CERT_FILE: $OPNSENSE_CA_FILE
  needs:
    - job: opnsense_inventory
      artifacts: true
    - job: opnsense_plan
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      nix develop ./flake -c tofu -chdir=tofu/opnsense show -json desired.tfplan
      > /tmp/desired.json && nix develop ./flake -c python -m
      opnsense_reconciler.check_plan --plan /tmp/desired.json --expect-uri "$OPNSENSE_URI"
    - >-
      test "$(nix develop ./flake -c python -c
      'import json;print(json.load(open("artifacts/opnsense/inventory.json"))["assignment_api_available"])')"
      = True
    - nix develop ./flake -c tofu -chdir=tofu/opnsense init -reconfigure
    - nix develop ./flake -c tofu -chdir=tofu/opnsense apply desired.tfplan
    - >-
      nix develop ./flake -c python -m opnsense_reconciler.reconcile
      --assignments opnsense_reconciler/assignments.json
      --inventory artifacts/opnsense/inventory.json
      --kea-interfaces opnsense_reconciler/kea-interfaces.json
      --bgp-neighbors opnsense_reconciler/bgp-neighbors.json
      --bgp-expected-routes opnsense_reconciler/bgp-expected-routes.json

nas_proof:
  stage: test
  tags:
    - nas
  variables:
    GIT_STRATEGY: none
  script:
    - hostname
    - ip -4 -brief address show
    - ping -c 2 -W 2 8.8.8.8
    - ping -c 2 -W 2 10.0.30.11

deploy_host:
  stage: deploy
  tags:
    - nas
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    DEPLOY_HOST: homelab-02
    DEPLOY_ADDR: 10.0.30.12
  before_script:
    - mkdir -p ~/.ssh
    - cp "$SSH_DEPLOY_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' '10.0.30.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIORsIz/OxVGnwGCaVTCpA3hGNHQCpFMxOS4qoQ9tsS3m' '10.0.30.12 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMdBycmzrCPvWWuHJoySTJNaA2Jm9Tl8K18xaE6PZiuu' '10.0.30.13 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPaLKiJo7dbQnkXx8xDwng/5sPWFY/hSyrugmH+BMXyC' '10.0.30.20 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILmHU+GOXCzFU9I9gbkcDROg0SZSk0ZfLbrQ4LpV8g/C' '10.0.30.10 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILljH4QOiAAugeFZwc5pMjB3Lj6fwiiDNA81OIaAgqkR' > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - export NIX_SSHOPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes"
    - nixos-rebuild --flake ./flake#"$DEPLOY_HOST" --target-host rupan@"$DEPLOY_ADDR" --build-host rupan@"$DEPLOY_ADDR" --use-remote-sudo switch
