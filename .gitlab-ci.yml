image: nixos/nix:latest

stages:
  - lint
  - test
  - security
  - sync
  - registry
  - opnsense
  - deploy

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  TF_STATE_NAME: opnsense-production
  TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_USERNAME: gitlab-ci-token
  TF_HTTP_PASSWORD: $CI_JOB_TOKEN
  TF_HTTP_LOCK_METHOD: POST
  TF_HTTP_UNLOCK_METHOD: DELETE
  TF_HTTP_RETRY_WAIT_MIN: "5"

.nas_ci:
  tags:
    - nas-ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.shared_feature:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

.nix_format:
  stage: lint
  script:
    - nix develop ./flake -c just fmt-check

nix_format:
  extends:
    - .nas_ci
    - .nix_format

nix_format_feature:
  extends:
    - .shared_feature
    - .nix_format

.repository_tests:
  stage: test
  script:
    - nix develop ./flake -c just provision-check-deps
    - nix develop ./flake -c just check
    - nix flake check ./flake

repository_tests:
  extends:
    - .nas_ci
    - .repository_tests

repository_tests_feature:
  extends:
    - .shared_feature
    - .repository_tests

.yaml_schema:
  stage: test
  script:
    - nix develop ./flake -c yamllint .

yaml_schema:
  extends:
    - .nas_ci
    - .yaml_schema

yaml_schema_feature:
  extends:
    - .shared_feature
    - .yaml_schema

.secret_scan:
  stage: security
  script:
    - nix develop ./flake -c gitleaks detect --source . --redact

secret_scan:
  extends:
    - .nas_ci
    - .secret_scan

secret_scan_feature:
  extends:
    - .shared_feature
    - .secret_scan

.registry_lock:
  stage: registry
  script:
    - nix develop ./flake -c just check-registry
    - nix develop ./flake -c just registry-plan > registry-copy-plan.json
  artifacts:
    expire_in: 7 days
    paths:
      - registry-copy-plan.json

registry_lock:
  extends:
    - .nas_ci
    - .registry_lock

registry_lock_feature:
  extends:
    - .shared_feature
    - .registry_lock

registry_resolve:
  stage: registry
  tags:
    - nas-ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - mkdir -p artifacts/registry
    - >-
      nix develop ./flake -c python -m scripts.registry inventory
      --output artifacts/registry/images.inventory.json
    - >-
      nix develop ./flake -c python -m scripts.registry resolve
      --inventory artifacts/registry/images.inventory.json
      --output artifacts/registry/images.lock.candidate.json
    - >-
      nix develop ./flake -c python -m scripts.registry plan
      --lock artifacts/registry/images.lock.candidate.json
      > artifacts/registry/copy-plan.candidate.json
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/registry/

registry_update_import:
  stage: registry
  tags:
    - nas-privileged
  environment:
    name: production
  resource_group: registry-content
  needs:
    - job: registry_resolve
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - export REGISTRY_DEST_AUTH_FILE="$REGISTRY_IMPORTER_AUTH_FILE"
    - export REGISTRY_SOURCE_AUTH_FILE
    - >-
      nix develop ./flake -c python -m scripts.registry copy
      --lock artifacts/registry/images.lock.candidate.json
      --kind upstream
      --report artifacts/registry/update-import-report.json
    - >-
      nix develop ./flake -c python -m scripts.registry verify
      --lock artifacts/registry/images.lock.candidate.json
      --kind upstream
      --report artifacts/registry/update-verify-report.json
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/registry/

.registry_ssh:
  tags:
    - nas-privileged
  environment:
    name: production
  before_script:
    - export PATH="/run/current-system/sw/bin:$PATH"
    - mkdir -p ~/.ssh
    - cp "$SSH_DEPLOY_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$HOSTS_KNOWN" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - export SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"
    - export KH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    - export NIX_SSHOPTS="$SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes"

deploy_registry_platform:
  extends: .registry_ssh
  stage: registry
  resource_group: registry-platform
  needs:
    - repository_tests
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo zfs list tank/registry >/dev/null 2>&1 || sudo zfs create -o mountpoint=legacy tank/registry;
      sudo install -d -m 0750 -o root -g root /tank/registry /persist/zot /persist/zot/status'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/htpasswd'
      < "$REGISTRY_HTPASSWD_FILE"
    - >-
      nix develop ./flake -c python -m scripts.registry access-control
      --lock registry/images.lock.json --output /tmp/zot-access-control.json
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/access-control.json'
      < /tmp/zot-access-control.json
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/cloudflare-dns-api-token'
      < "$REGISTRY_CLOUDFLARE_TOKEN_FILE"
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/zot/restic-password'
      < "$REGISTRY_RESTIC_PASSWORD_FILE"
    - >-
      nixos-rebuild --flake ./flake#nas-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.20 --build-host rupan@10.0.30.20
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo chown root:zot /persist/zot/restic-password;
      sudo chmod 0640 /persist/zot/restic-password'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'mountpoint -q /tank/registry && sudo systemctl is-active zot nginx'

deploy_registry_dns:
  extends: .registry_ssh
  stage: registry
  resource_group: registry-dns
  needs:
    - deploy_registry_platform
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      nixos-rebuild --flake ./flake#adguard-netbird-01 --use-remote-sudo switch
      --target-host rupan@10.0.30.10 --build-host rupan@10.0.30.10
    - >-
      test "$(getent ahostsv4 registry.rupan.dev | awk 'NR == 1 { print $1 }')"
      = 10.0.30.20
    - >-
      test "$(nix develop ./flake -c curl --silent --show-error --output /dev/null
      --write-out '%{http_code}' https://registry.rupan.dev/v2/)" = 401

registry_import:
  extends: .registry_ssh
  stage: registry
  resource_group: registry-content
  needs:
    - registry_lock
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      test "$(getent ahostsv4 registry.rupan.dev | awk 'NR == 1 { print $1 }')"
      = 10.0.30.20
    - >-
      test "$(nix develop ./flake -c curl --silent --show-error --output /dev/null
      --write-out '%{http_code}' https://registry.rupan.dev/v2/)" = 401
    - mkdir -p artifacts/registry
    - export REGISTRY_DEST_AUTH_FILE="$REGISTRY_MIGRATION_AUTH_FILE"
    - export REGISTRY_SOURCE_AUTH_FILE
    - nix develop ./flake -c just registry-copy artifacts/registry/import-report.json
    - nix develop ./flake -c just registry-verify artifacts/registry/verify-report.json
    - >-
      date +%s | ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.20
      'sudo install -m 0644 -o zot -g zot /dev/stdin /persist/zot/status/import-last-success.tmp;
      sudo sync -f /persist/zot/status/import-last-success.tmp;
      sudo mv /persist/zot/status/import-last-success.tmp /persist/zot/status/import-last-success;
      sudo sync -f /persist/zot/status'
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/registry/

.deploy_registry_node:
  extends: .registry_ssh
  stage: deploy
  resource_group: registry-node-rollout
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      test "$(nix eval --json
      path:.?dir=flake#nixosConfigurations.${DEPLOY_HOST}-registry.config.homelab.k3s.registry.enable)"
      = "true"
    - >-
      nix develop ./flake -c python -m scripts.registry node-config
      --lock registry/images.lock.json --username node
      --password-file "$REGISTRY_NODE_PASSWORD_FILE"
      --output /tmp/k3s-registries.yaml
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@"$DEPLOY_ADDR"
      'sudo install -m 0600 -o root -g root /dev/stdin /persist/secrets/k3s-registries.yaml'
      < /tmp/k3s-registries.yaml
    - >-
      nixos-rebuild --flake ./flake#"$DEPLOY_HOST-registry" --use-remote-sudo switch
      --target-host rupan@"$DEPLOY_ADDR" --build-host rupan@"$DEPLOY_ADDR"
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@"$DEPLOY_ADDR"
      'sudo systemctl is-active k3s && sudo test -s /etc/rancher/k3s/registries.yaml'
    - >-
      ssh $SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes rupan@10.0.30.11
      'sudo k3s kubectl get --raw="/readyz?verbose" | grep -F "[+]etcd ok";
      sudo k3s kubectl wait --for=condition=Ready node --all --timeout=120s'

deploy_registry_node_01:
  extends: .deploy_registry_node
  needs:
    - registry_import
  variables:
    DEPLOY_HOST: homelab-01
    DEPLOY_ADDR: 10.0.30.11

deploy_registry_node_02:
  extends: .deploy_registry_node
  needs:
    - deploy_registry_node_01
  variables:
    DEPLOY_HOST: homelab-02
    DEPLOY_ADDR: 10.0.30.12

deploy_registry_node_03:
  extends: .deploy_registry_node
  needs:
    - deploy_registry_node_02
  variables:
    DEPLOY_HOST: homelab-03
    DEPLOY_ADDR: 10.0.30.13

opnsense_inventory:
  stage: opnsense
  tags:
    - nas-privileged
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - nix develop ./flake -c python -m opnsense_reconciler.inventory --artifact-dir artifacts/opnsense
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/opnsense/

opnsense_plan:
  stage: opnsense
  tags:
    - nas-privileged
  environment:
    name: production
  variables:
    # The firewall serves its default self-signed cert (SAN: OPNsense.internal,
    # no IP SANs) and the tofu provider has no TLS server-name override, so it
    # must address the firewall by its certificate DNS name, not the IP literal.
    OPNSENSE_URI: "https://OPNsense.internal"
    SSL_CERT_FILE: $OPNSENSE_CA_FILE
    TF_VAR_opnsense_uri: "https://OPNsense.internal"
  needs:
    - job: opnsense_inventory
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - >-
      test "$(nix develop ./flake -c python -c
      'import json;print(json.load(open("artifacts/opnsense/inventory.json"))["assignment_api_available"])')"
      = True
    - nix develop ./flake -c tofu -chdir=tofu/opnsense init -reconfigure
    - nix develop ./flake -c tofu -chdir=tofu/opnsense validate
    - nix develop ./flake -c tofu -chdir=tofu/opnsense plan -refresh-only -out=refresh-only.tfplan
    - nix develop ./flake -c tofu -chdir=tofu/opnsense plan -out=desired.tfplan
  artifacts:
    expire_in: 7 days
    paths:
      - tofu/opnsense/refresh-only.tfplan
      - tofu/opnsense/desired.tfplan

opnsense_apply:
  stage: opnsense
  tags:
    - nas-privileged
  environment:
    name: production
  variables:
    OPNSENSE_URI: "https://OPNsense.internal"
    SSL_CERT_FILE: $OPNSENSE_CA_FILE
  needs:
    - job: opnsense_inventory
      artifacts: true
    - job: opnsense_plan
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - >-
      nix develop ./flake -c tofu -chdir=tofu/opnsense show -json desired.tfplan
      > /tmp/desired.json && nix develop ./flake -c python -m
      opnsense_reconciler.check_plan --plan /tmp/desired.json --expect-uri "$OPNSENSE_URI"
    - >-
      test "$(nix develop ./flake -c python -c
      'import json;print(json.load(open("artifacts/opnsense/inventory.json"))["assignment_api_available"])')"
      = True
    - nix develop ./flake -c tofu -chdir=tofu/opnsense init -reconfigure
    - nix develop ./flake -c tofu -chdir=tofu/opnsense apply desired.tfplan
    - >-
      nix develop ./flake -c python -m opnsense_reconciler.reconcile
      --assignments opnsense_reconciler/assignments.json
      --inventory artifacts/opnsense/inventory.json
      --kea-interfaces opnsense_reconciler/kea-interfaces.json
      --bgp-neighbors opnsense_reconciler/bgp-neighbors.json
      --bgp-expected-routes opnsense_reconciler/bgp-expected-routes.json

nas_proof:
  extends: .nas_ci
  stage: test
  variables:
    GIT_STRATEGY: none
  script:
    - hostname
    - ip -4 -brief address show
    - ping -c 2 -W 2 8.8.8.8
    - ping -c 2 -W 2 10.0.30.11

deploy_host:
  stage: deploy
  tags:
    - nas-privileged
  environment:
    name: production
  needs:
    - repository_tests
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    DEPLOY_HOST: homelab-02
    DEPLOY_ADDR: 10.0.30.12
  before_script:
    - mkdir -p ~/.ssh
    - cp "$SSH_DEPLOY_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$HOSTS_KNOWN" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - export PATH="/run/current-system/sw/bin:$PATH"
    - export SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"
    - export KH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    - export NIX_SSHOPTS="$SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes"
    - nixos-rebuild --flake ./flake#"$DEPLOY_HOST" --use-remote-sudo switch
      --target-host rupan@"$DEPLOY_ADDR" --build-host rupan@"$DEPLOY_ADDR"

deploy_adguard_netbird:
  stage: deploy
  tags:
    - nas-privileged
  environment:
    name: production
  needs:
    - repository_tests
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    DEPLOY_HOST: adguard-netbird-01
    DEPLOY_ADDR: 10.0.30.10
  before_script:
    - mkdir -p ~/.ssh
    - cp "$SSH_DEPLOY_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$HOSTS_KNOWN" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - export PATH="/run/current-system/sw/bin:$PATH"
    - export SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"
    - export KH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts"
    - export NIX_SSHOPTS="$SSH_OPTS $KH_OPTS -o StrictHostKeyChecking=yes"
    - >-
      ssh $SSH_OPTS $KH_OPTS rupan@"$DEPLOY_ADDR"
      'install -d -m 0700 /persist/secrets'
    - >-
      printf '%s' "$HOME_ASSISTANT_MQTT_PASSWORD" |
      ssh $SSH_OPTS $KH_OPTS rupan@"$DEPLOY_ADDR"
      'umask 077; cat > /persist/secrets/mosquitto-home-assistant-password.tmp &&
      mv /persist/secrets/mosquitto-home-assistant-password.tmp
      /persist/secrets/mosquitto-home-assistant-password'
    - >-
      printf '%s' "$ZIGBEE2MQTT_MQTT_PASSWORD" |
      ssh $SSH_OPTS $KH_OPTS rupan@"$DEPLOY_ADDR"
      'umask 077; cat > /persist/secrets/mosquitto-zigbee2mqtt-password.tmp &&
      mv /persist/secrets/mosquitto-zigbee2mqtt-password.tmp
      /persist/secrets/mosquitto-zigbee2mqtt-password'
    - nixos-rebuild --flake ./flake#"$DEPLOY_HOST" --use-remote-sudo switch
      --target-host rupan@"$DEPLOY_ADDR" --build-host rupan@"$DEPLOY_ADDR"

sync_to_github:
  stage: sync
  image: nixos/nix:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - >-
      nix develop ./flake -c bash -e -c '
        git remote add github "https://oauth2:$GITHUB_TOKEN@github.com/JEFF7712/homelab-new.git"
        git fetch --unshallow || git fetch --all

        mirror_warning="**NOTE - This repository is a mirror.** Active development happens "
        mirror_warning+="on [GitLab](https://gitlab.com/JEFF7712/homelab-new)."
        printf "%s\n\n%s" "$mirror_warning" "$(cat README.md)" > README.md

        git config user.email "runner@gitlab.com"
        git config user.name "GitLab Runner"
        git commit -am "Automated: Add GitHub Mirror Warning" || echo "No changes to commit"

        for attempt in 1 2 3; do
          if git -c http.version=HTTP/1.1 push github HEAD:main --force; then
            exit 0
          fi
          sleep $((attempt * 15))
        done
        exit 1
      '
